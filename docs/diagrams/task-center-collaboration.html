<script>
const viewport=document.getElementById('viewport'),sheet=document.getElementById('sheet'),ratio=document.getElementById('ratio');
let zoom=1;
function setZoom(value){zoom=Math.max(.25,Math.min(2,value));sheet.style.width=2600*zoom+'px';ratio.textContent=Math.round(zoom*100)+'%';}
function fit(){setZoom((viewport.clientWidth-40)/2600);}
document.getElementById('fit').onclick=fit;document.getElementById('minus').onclick=()=>setZoom(zoom/1.2);
document.getElementById('plus').onclick=()=>setZoom(zoom*1.2);document.getElementById('actual').onclick=()=>setZoom(1);
viewport.addEventListener('wheel',event=>{if(event.ctrlKey){event.preventDefault();setZoom(zoom*(event.deltaY<0?1.1:1/1.1));}},{passive:false});
fit();
</script></body></html>
