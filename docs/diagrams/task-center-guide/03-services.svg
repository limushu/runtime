<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="ink" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#252b32" stroke-width="1.5"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245e87" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#28715a" stroke-width="1.5"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9c5b24" stroke-width="1.5"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65717c" stroke-width="1.5"/></marker><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style></defs>
<rect width="1600" height="1000" fill="white"/>
<text x="50" y="42" font-size="18" fill="#65717c" text-anchor="start" font-weight="400">TASKCENTER / 系统导读 / 3 OF 5</text>
<text x="50" y="88" font-size="34" fill="#252b32" text-anchor="start" font-weight="600">展开领域服务：谁真正执行 Activity？</text>
<text x="50" y="125" font-size="22" fill="#65717c" text-anchor="start" font-weight="400">Disk、Node、VD 各自有一套这样的宿主；服务本身不承担 Workflow 的业务冲突排队。</text>
<rect x="460" y="175" width="1080" height="700" rx="7" fill="#fbfcfd" stroke="#28715a" stroke-width="1.7" stroke-dasharray="9 7"/>
<path d="M390 250 H520" fill="none" stroke="white" stroke-width="7"/><path d="M390 250 H520" fill="none" stroke="#245e87" stroke-width="2.3"  marker-end="url(#blue)"/>
<path d="M850 435 H900 V325 H1320 V300" fill="none" stroke="white" stroke-width="7"/><path d="M850 435 H900 V325 H1320 V300" fill="none" stroke="#65717c" stroke-width="2.3"  marker-end="url(#gray)"/>
<path d="M745 300 V410" fill="none" stroke="white" stroke-width="7"/><path d="M745 300 V410" fill="none" stroke="#28715a" stroke-width="2.3"  marker-end="url(#green)"/>
<path d="M850 465 H1030" fill="none" stroke="white" stroke-width="7"/><path d="M850 465 H1030" fill="none" stroke="#252b32" stroke-width="2.3"  marker-end="url(#ink)"/>
<path d="M1255 520 V590" fill="none" stroke="white" stroke-width="7"/><path d="M1255 520 V590" fill="none" stroke="#252b32" stroke-width="2.3"  marker-end="url(#ink)"/>
<path d="M1255 680 V755" fill="none" stroke="white" stroke-width="7"/><path d="M1255 680 V755" fill="none" stroke="#252b32" stroke-width="2.3"  marker-end="url(#ink)"/>
<path d="M1030 500 H930 V685 H850" fill="none" stroke="white" stroke-width="7"/><path d="M1030 500 H930 V685 H850" fill="none" stroke="#9c5b24" stroke-width="2.3"  marker-end="url(#orange)"/>
<path d="M500 710 H430 V545 H390" fill="none" stroke="white" stroke-width="7"/><path d="M500 710 H430 V545 H390" fill="none" stroke="#28715a" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#green)"/>
<path d="M1255 845 V910 H225 V845" fill="none" stroke="white" stroke-width="7"/><path d="M1255 845 V910 H225 V845" fill="none" stroke="#65717c" stroke-width="2.3"  marker-end="url(#gray)"/>
<rect x="60" y="200" width="330" height="100" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="225" y="234" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">ActivityClient</text><text x="225" y="266" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Workflow 的类型化调用入口</text>
<rect x="520" y="200" width="450" height="100" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="745" y="234" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">服务邮箱</text><text x="745" y="266" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Execute / Query；bounded mpsc</text>
<rect x="1100" y="200" width="440" height="100" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="1320" y="234" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">Query 旁路</text><text x="1320" y="266" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">宿主直接 query()，读取已确认视图</text>
<rect x="500" y="410" width="350" height="110" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="675" y="444" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">宿主循环 · select!</text><text x="675" y="476" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">收请求 / 驱动在途步骤 / 停止</text>
<rect x="1030" y="410" width="450" height="110" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1255" y="444" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">Activity Future 集合</text><text x="1255" y="476" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">FuturesUnordered；多个步骤可等待</text>
<rect x="1030" y="590" width="450" height="90" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1255" y="624" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">Host.execute()</text><text x="1255" y="656" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">runtime 适配器：转发能力调用</text>
<rect x="1030" y="755" width="450" height="90" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1255" y="789" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">领域 Service + Model</text><text x="1255" y="821" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">校验业务规则、组织操作、提交状态</text>
<rect x="500" y="590" width="350" height="240" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="675" y="624" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">ActivityGuard / 收尾</text><text x="675" y="656" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">持有资源 Permit</text><text x="675" y="685" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">标记 started / settled</text><text x="675" y="714" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">结束时通知 Tracker</text><text x="675" y="743" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Drop 时发送 Release</text><text x="675" y="772" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">步骤结果另走 oneshot</text>
<rect x="60" y="460" width="330" height="165" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="225" y="494" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">回到 Workflow / Driver</text><text x="225" y="526" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">结果 → 继续编排</text><text x="225" y="555" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Tracker → 确认停稳</text><text x="225" y="584" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Release → 更新资源表</text>
<rect x="60" y="750" width="330" height="95" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="225" y="784" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">Ports / Adapter</text><text x="225" y="816" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">实际 I/O 与元数据操作</text>
<text x="455" y="233" text-anchor="middle" font-size="19" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">Execute</text>
<text x="1110" y="314" text-anchor="middle" font-size="19" fill="#65717c" stroke="white" stroke-width="6" paint-order="stroke">Query</text>
<text x="478" y="162" font-size="24" fill="#28715a" text-anchor="start" font-weight="600">一个领域服务宿主 · 一个独立 task</text>
<text x="940" y="448" text-anchor="middle" font-size="18" fill="#252b32" stroke="white" stroke-width="6" paint-order="stroke">running.next()</text>
<text x="930" y="567" text-anchor="middle" font-size="20" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">执行结束</text>
<text x="780" y="900" text-anchor="middle" font-size="21" fill="#65717c" stroke="white" stroke-width="6" paint-order="stroke">调用外部端口 / 等待结果</text>
<path d="M50 942 H1550" stroke="#d7dde3"/><text x="50" y="977" font-size="22" fill="#252b32" text-anchor="start" font-weight="400">服务宿主驱动 Activity；TaskCenter 驱动 Workflow。两者用请求 / 回复协作，不共享同一个执行循环。</text>
</svg>
