<text x="50" y="42" font-size="18" fill="#65717c" text-anchor="start" font-weight="400">TASKCENTER / 系统导读 / 1 OF 5</text>
<text x="50" y="88" font-size="34" fill="#252b32" text-anchor="start" font-weight="600">整体框架与驱动闭环：一次等待如何变成下一次执行？</text>
<text x="50" y="125" font-size="22" fill="#65717c" text-anchor="start" font-weight="400">读图主线：Workflow 发申请 → 资源分支处理 → Permit 唤醒 → Driver 再次 poll → 调用领域服务。</text>
