<rect x="60" y="170" width="1780" height="85" rx="5" fill="white" stroke="#252b32" stroke-width="2"/><text x="950" y="204" font-size="25" fill="#252b32" text-anchor="middle" font-weight="600">PoolManager → Pool（组合根）</text><text x="950" y="236" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">定位目标 Pool；装配 TaskCenter 与领域服务；管理生命周期</text>
<rect x="100" y="360" width="440" height="110" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="320" y="394" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">主循环：reap → pump → select!</text><text x="320" y="426" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">新提交 / 轮询 driver.tick() / 停止</text>
<rect x="790" y="360" width="450" height="110" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="1015" y="394" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">State：流程协调</text><text x="1015" y="426" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">冲突规则 / 队列 / 对象占用与隔离</text>
<rect x="120" y="610" width="300" height="90" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="270" y="644" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">tick()：select!</text><text x="270" y="676" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">同时轮询两个分支</text>
<rect x="850" y="610" width="390" height="90" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="1045" y="644" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">Workflow Future 集合</text><text x="1045" y="676" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">FuturesUnordered；等待启动许可</text>
<rect x="120" y="785" width="300" height="90" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="270" y="819" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">资源事件队列</text><text x="270" y="851" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Acquire / Release / Withdraw</text>
<rect x="500" y="785" width="250" height="90" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="625" y="819" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">Broker</text><text x="625" y="851" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">发请求；等待许可</text>
<rect x="120" y="1010" width="300" height="120" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="270" y="1044" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">LockTable</text><text x="270" y="1076" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">waiting / held / fences</text><text x="270" y="1105" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">只由 Driver 处理资源事件</text>
<rect x="850" y="785" width="390" height="130" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="1045" y="819" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">WorkflowContext</text><text x="1045" y="851" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">ctx.activity() → acquire().await</text><text x="1045" y="880" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">未获许可：当前 Future 为 Pending</text>
<rect x="850" y="1010" width="390" height="120" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="1045" y="1044" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">ActivityClient</text><text x="1045" y="1076" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">发送请求 + 取消上下文 + Guard</text><text x="1045" y="1105" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">等待服务的 oneshot 结果</text>
<rect x="90" y="1210" width="1190" height="80" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="685" y="1244" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">配套结构：控制、观察与执行收尾</text><text x="685" y="1276" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">TaskRegistry / ExecutionView / RunControl　｜　Tracker / Completion</text>
<rect x="1480" y="365" width="330" height="100" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1645" y="399" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">DiskService / DiskHost</text><text x="1645" y="431" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">磁盘对象与能力</text>
<rect x="1480" y="510" width="330" height="100" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1645" y="544" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">NodeService / NodeHost</text><text x="1645" y="576" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">节点对象与能力</text>
<rect x="1480" y="655" width="330" height="100" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1645" y="689" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">VdService / VdHost</text><text x="1645" y="721" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">VD / BG 对象与能力</text>
<rect x="1480" y="815" width="330" height="90" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1645" y="849" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">每个服务各自的邮箱</text><text x="1645" y="881" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Execute / Query</text>
<rect x="1480" y="975" width="330" height="145" rx="5" fill="white" stroke="#28715a" stroke-width="2"/><text x="1645" y="1009" font-size="25" fill="#28715a" text-anchor="middle" font-weight="600">每个服务各自的宿主</text><text x="1645" y="1041" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">轮询 Activity Futures</text><text x="1645" y="1070" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Host → Service → Model</text><text x="1645" y="1099" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">Ports → Adapter → I/O</text>
<rect x="60" y="1370" width="1780" height="70" rx="5" fill="white" stroke="#252b32" stroke-width="2"/><text x="950" y="1404" font-size="25" fill="#252b32" text-anchor="middle" font-weight="600">Tokio 调度上述 task；workflow-foundation 提供 Driver、Context、锁表和服务宿主等机制</text>
<text x="78" y="307" font-size="24" fill="#245e87" text-anchor="start" font-weight="600">TaskCenter · 1 个独立 task</text>
<text x="665" y="397" text-anchor="middle" font-size="21" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">检查 / 放行 / 交接</text>
<text x="500" y="557" font-size="24" fill="#245e87" text-anchor="start" font-weight="600">WorkflowDriver · 不另起 task</text>
<text x="340" y="530" text-anchor="middle" font-size="21" fill="#252b32" stroke="white" stroke-width="6" paint-order="stroke">driver.tick()</text>
<text x="1045" y="520" text-anchor="middle" font-size="20" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">defer 登记 / StartPermit 放行</text>
<text x="635" y="636" text-anchor="middle" font-size="21" fill="#252b32" stroke="white" stroke-width="6" paint-order="stroke">running.next()：轮询就绪 Future</text>
<text x="270" y="755" text-anchor="middle" font-size="21" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">events.recv()</text>
<text x="905" y="749" text-anchor="middle" font-size="20" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">poll</text>
<text x="1196" y="746" text-anchor="middle" font-size="20" fill="#28715a" stroke="white" stroke-width="6" paint-order="stroke">Waker</text>
<text x="800" y="813" text-anchor="middle" font-size="18" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">Acquire</text>
<text x="460" y="813" text-anchor="middle" font-size="18" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">入队</text>
<text x="270" y="960" text-anchor="middle" font-size="20" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">table.event() → pump()</text>
<text x="615" y="1052" text-anchor="middle" font-size="21" fill="#28715a" stroke="white" stroke-width="6" paint-order="stroke">oneshot 返回 Permit</text>
<text x="980" y="967" text-anchor="middle" font-size="20" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">获准：注册 Guard / dispatch</text>
<text x="1468" y="307" font-size="24" fill="#28715a" text-anchor="start" font-weight="600">领域服务 ×3 · 各有 1 个 task</text>
<text x="1355" y="839" text-anchor="middle" font-size="21" fill="#245e87" stroke="white" stroke-width="6" paint-order="stroke">请求入队</text>
<text x="1725" y="948" text-anchor="middle" font-size="20" fill="#28715a" stroke="white" stroke-width="6" paint-order="stroke">接收 / 执行</text>
<text x="1370" y="1130" text-anchor="middle" font-size="20" fill="#28715a" stroke="white" stroke-width="6" paint-order="stroke">返回步骤结果</text>
<text x="760" y="1174" text-anchor="middle" font-size="21" fill="#9c5b24" stroke="white" stroke-width="6" paint-order="stroke">实际执行结束：Guard 释放 Permit → Release 入队 → Driver 更新 LockTable</text>
<text x="1645" y="1250" font-size="22" fill="#28715a" text-anchor="middle" font-weight="400">完成时还通知 Tracker</text>
<text x="1645" y="1280" font-size="21" fill="#28715a" text-anchor="middle" font-weight="400">流程结束必须等待步骤停稳</text>
<path d="M50 1465 H1850" stroke="#d7dde3"/><text x="50" y="1498" font-size="22" fill="#252b32" text-anchor="start" font-weight="400">Permit 使等待中的 Workflow 可继续轮询；Waker 不直接执行它。running.next() 只有在某个 Workflow 整体结束时才返回完成项。</text>
<path d="M1180 1010 V915" fill="none" stroke="#28715a" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#green)"/><text x="1230" y="966" font-family="Microsoft YaHei" font-size="18" text-anchor="middle" fill="#28715a">结果就绪</text></svg>
