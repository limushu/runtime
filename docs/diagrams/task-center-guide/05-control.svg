<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="ink" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#252b32" stroke-width="1.5"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245e87" stroke-width="1.5"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#28715a" stroke-width="1.5"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9c5b24" stroke-width="1.5"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65717c" stroke-width="1.5"/></marker><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style></defs>
<rect width="1600" height="1000" fill="white"/>
<text x="50" y="42" font-size="18" fill="#65717c" text-anchor="start" font-weight="400">TASKCENTER / 系统导读 / 5 OF 5</text>
<text x="50" y="88" font-size="34" fill="#252b32" text-anchor="start" font-weight="600">展开控制：暂停、取消和观察有什么不同？</text>
<text x="50" y="125" font-size="22" fill="#65717c" text-anchor="start" font-weight="400">控制改变执行条件；右侧虚线表示共享句柄与 watch 关系，不是另一条事件处理流水线。</text>
<rect x="60" y="215" width="450" height="660" rx="7" fill="#fbfcfd" stroke="#245e87" stroke-width="1.7" />
<rect x="575" y="215" width="450" height="660" rx="7" fill="#fbfcfd" stroke="#9c5b24" stroke-width="1.7" />
<rect x="1090" y="215" width="450" height="660" rx="7" fill="#fbfcfd" stroke="#65717c" stroke-width="1.7" />
<path d="M285 345 V425" fill="none" stroke="white" stroke-width="7"/><path d="M285 345 V425" fill="none" stroke="#245e87" stroke-width="2.3"  marker-end="url(#blue)"/>
<path d="M285 535 V620" fill="none" stroke="white" stroke-width="7"/><path d="M285 535 V620" fill="none" stroke="#245e87" stroke-width="2.3"  marker-end="url(#blue)"/>
<path d="M285 710 V770" fill="none" stroke="white" stroke-width="7"/><path d="M285 710 V770" fill="none" stroke="#245e87" stroke-width="2.3"  marker-end="url(#blue)"/>
<path d="M800 345 V425" fill="none" stroke="white" stroke-width="7"/><path d="M800 345 V425" fill="none" stroke="#9c5b24" stroke-width="2.3"  marker-end="url(#orange)"/>
<path d="M800 535 V620" fill="none" stroke="white" stroke-width="7"/><path d="M800 535 V620" fill="none" stroke="#9c5b24" stroke-width="2.3"  marker-end="url(#orange)"/>
<path d="M800 710 V770" fill="none" stroke="white" stroke-width="7"/><path d="M800 710 V770" fill="none" stroke="#9c5b24" stroke-width="2.3"  marker-end="url(#orange)"/>
<path d="M1315 345 V425" fill="none" stroke="white" stroke-width="7"/><path d="M1315 345 V425" fill="none" stroke="#65717c" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<path d="M1315 535 V620" fill="none" stroke="white" stroke-width="7"/><path d="M1315 535 V620" fill="none" stroke="#65717c" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<path d="M1315 710 V770" fill="none" stroke="white" stroke-width="7"/><path d="M1315 710 V770" fill="none" stroke="#65717c" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<rect x="90" y="255" width="390" height="90" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="285" y="289" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">RunControl.pause()</text><text x="285" y="321" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">watch 记录暂停请求</text>
<rect x="90" y="425" width="390" height="110" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="285" y="459" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">WorkflowContext.safe_point()</text><text x="285" y="491" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">当前 Activity 不被强制中断</text><text x="285" y="520" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">到达安全边界后确认 Paused</text>
<rect x="90" y="620" width="390" height="90" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="285" y="654" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">保留 Workflow 与对象占用</text><text x="285" y="686" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">暂停不等于让出对象</text>
<rect x="90" y="770" width="390" height="75" rx="5" fill="white" stroke="#245e87" stroke-width="2"/><text x="285" y="804" font-size="25" fill="#245e87" text-anchor="middle" font-weight="600">resume() → 同一个 Future 继续</text>
<rect x="605" y="255" width="390" height="90" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="800" y="289" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">RunControl.cancel()</text><text x="800" y="321" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">取消令牌传递给 ActivityContext</text>
<rect x="605" y="425" width="390" height="110" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="800" y="459" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">Activity 协作式停止</text><text x="800" y="491" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">不能用丢弃 Future 代替停稳</text><text x="800" y="520" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">取消不保证回滚已经完成的效果</text>
<rect x="605" y="620" width="390" height="90" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="800" y="654" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">Tracker.settle()</text><text x="800" y="686" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">等待已接受步骤真正结束</text>
<rect x="605" y="770" width="390" height="75" rx="5" fill="white" stroke="#9c5b24" stroke-width="2"/><text x="800" y="804" font-size="25" fill="#9c5b24" text-anchor="middle" font-weight="600">终态 → 释放对象 / 保留隔离</text>
<rect x="1120" y="255" width="390" height="90" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="1315" y="289" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">Context / Completion</text><text x="1315" y="321" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">发布状态与进度 watch</text>
<rect x="1120" y="425" width="390" height="110" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="1315" y="459" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">TaskRegistry</text><text x="1315" y="491" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">登记 RunControl / 保留有限历史</text><text x="1315" y="520" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">持有观察与控制所需的共享句柄</text>
<rect x="1120" y="620" width="390" height="90" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="1315" y="654" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">ExecutionView / Observer</text><text x="1315" y="686" font-size="21" fill="#252b32" text-anchor="middle" font-weight="400">快照 / 订阅状态变化</text>
<rect x="1120" y="770" width="390" height="75" rx="5" fill="white" stroke="#65717c" stroke-width="2"/><text x="1315" y="804" font-size="25" fill="#65717c" text-anchor="middle" font-weight="600">调用者查看任务；不驱动任务</text>
<text x="78" y="202" font-size="24" fill="#245e87" text-anchor="start" font-weight="600">暂停 / 恢复</text>
<text x="593" y="202" font-size="24" fill="#9c5b24" text-anchor="start" font-weight="600">取消 / 停稳</text>
<text x="1108" y="202" font-size="24" fill="#65717c" text-anchor="start" font-weight="600">观察 / 进度</text>
<path d="M50 942 H1550" stroke="#d7dde3"/><text x="50" y="977" font-size="22" fill="#252b32" text-anchor="start" font-weight="400">watch 会合并变化，不是持久化日志；尚无按类型自动暂停、按业务阶段恢复或跨进程恢复。</text>
</svg>
