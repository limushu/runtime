<footer><button id="prev" type="button">← 上一张</button><button id="next" type="button">下一张 →</button><span id="page-title"></span><button id="fit" type="button">适应窗口</button><button id="minus" type="button" aria-label="缩小">−</button><span id="ratio"></span><button id="plus" type="button" aria-label="放大">+</button><button id="actual" type="button">原尺寸</button></footer>
<script>
const pages=Array.from(document.querySelectorAll('section')),tabs=Array.from(document.querySelectorAll('nav button'));
const viewport=document.getElementById('viewport'),ratio=document.getElementById('ratio');let current=0,zoom=1;
function setZoom(value){zoom=Math.max(.25,Math.min(2.5,value));pages[current].style.width=pages[current].querySelector('svg').viewBox.baseVal.width*zoom+'px';ratio.textContent=Math.round(zoom*100)+'%';}
function fit(){const box=pages[current].querySelector('svg').viewBox.baseVal;setZoom(Math.min(1,(viewport.clientWidth-32)/box.width,(viewport.clientHeight-32)/box.height));}
function show(index){current=Math.max(0,Math.min(pages.length-1,index));pages.forEach((page,i)=>{page.hidden=i!==current;tabs[i].setAttribute('aria-current',i===current?'page':'false');});
document.getElementById('page-title').textContent=(current+1)+' / '+pages.length+' · '+pages[current].getAttribute('aria-label');
document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;
viewport.scrollTop=0;viewport.scrollLeft=0;fit();history.replaceState(null,'','#'+pages[current].id);}
tabs.forEach((button,i)=>button.addEventListener('click',()=>show(i)));
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
document.getElementById('fit').onclick=fit;document.getElementById('minus').onclick=()=>setZoom(zoom/1.2);
document.getElementById('plus').onclick=()=>setZoom(zoom*1.2);document.getElementById('actual').onclick=()=>setZoom(1);
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();show(current+1);}if(event.key==='ArrowLeft'){event.preventDefault();show(current-1);}});
viewport.addEventListener('wheel',event=>{if(event.ctrlKey){event.preventDefault();setZoom(zoom*(event.deltaY<0?1.1:1/1.1));}},{passive:false});
show(Math.max(0,pages.findIndex(page=>page.id===location.hash.slice(1))));
</script></body></html>
