t x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">Driver tick：两个工作分支，分别何时返回？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">同一个宿主内的 select，不是两个 worker，也不是每轮先资源、再工作流各执行一次。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="170" width="1042" height="700" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="205" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">TaskCenter   ·   一个 Tokio task</text><g class="component" data-key="state" tabindex="0" role="button" aria-label="外层循环：reap → pump → select"><rect class="card" x="78" y="225" width="982" height="110" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="240" width="4" height="80" rx="2" fill="#2459aa"/><text x="98" y="257" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">外层循环：reap → pump → select</text><text x="98" y="287" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">处理提交 / shutdown / 提交确认回执 / driver.tick()</text><text x="98" y="315" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">tick 返回 Some 或 None 都回到外层重新规划；外层其他分支也可就绪</text></g><rect x="78" y="352" width="982" height="490" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="100" y="387" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowDriver.tick()   ·   tokio::select! { biased; … }</text><g class="component" data-key="notify" tabindex="0" role="button" aria-label="通知支路：wake.notified() → None"><rect class="card" x="108" y="410" width="922" height="78" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="108" y="425" width="4" height="48" rx="2" fill="#172b45"/><text x="128" y="442" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">通知支路：wake.notified() → None</text><text x="128" y="472" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">控制 / ACK 变化通知外层重算；与 Permit / 服务回复的 Waker 不同</text></g><g class="component" data-key="resource" tabindex="0" role="button" aria-label="① events.recv()"><rect class="card" x="108" y="535" width="425" height="110" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="108" y="550" width="4" height="80" rx="2" fill="#99611c"/><text x="128" y="567" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">① events.recv()</text><text x="128" y="597" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">table.event(event, &amp;broker)</text><text x="128" y="625" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">消费一条事件 → publish → None</text></g><g class="component" data-key="future" tabindex="0" role="button" aria-label="② running.next()"><rect class="card" x="585" y="535" width="445" height="110" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="585" y="550" width="4" height="80" rx="2" fill="#7055a2"/><text x="605" y="567" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">② running.next()</text><text x="605" y="597" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">poll 就绪的 Workflow Futures</text><text x="605" y="625" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">整体完成 → finish(id) → Some(id)</text></g><g class="component" data-key="locks" tabindex="0" role="button" aria-label="Broker / 队列 / LockTable"><rect class="card" x="108" y="695" width="425" height="115" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="108" y="710" width="4" height="85" rx="2" fill="#99611c"/><text x="128" y="727" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">Broker / 队列 / LockTable</text><text x="128" y="757" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Acquire / Release / Withdraw</text><text x="128" y="785" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">许可、等待、释放、隔离</text></g><g class="component" data-key="context" tabindex="0" role="button" aria-label="WorkflowContext / ActivityClient"><rect class="card" x="585" y="695" width="445" height="115" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="585" y="710" width="4" height="85" rx="2" fill="#7055a2"/><text x="605" y="727" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowContext / ActivityClient</text><text x="605" y="757" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">await Pending：② 尚未就绪</text><text x="605" y="785" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">许可或回复唤醒后才再次 poll</text></g><rect x="1120" y="170" width="432" height="700" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="1142" y="205" font-size="21" fill="#237562" font-weight="650" text-anchor="start">领域服务   ·   独立 Tokio task</text><g class="component" data-key="mail" tabindex="0" role="button" aria-label="服务邮箱 / ServiceHost"><rect class="card" x="1150" y="235" width="372" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="250" width="4" height="95" rx="2" fill="#237562"/><text x="1170" y="267" font-size="24" fill="#237562" font-weight="650" text-anchor="start">服务邮箱 / ServiceHost</text><text x="1170" y="297" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Execute + Context + Guard</text><text x="1170" y="325" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">登记并轮询 Activity Futures</text></g><g class="component" data-key="domain" tabindex="0" role="button" aria-label="Handler → Service → Ports"><rect class="card" x="1150" y="450" width="372" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="465" width="4" height="95" rx="2" fill="#237562"/><text x="1170" y="482" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Handler → Service → Ports</text><text x="1170" y="512" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域校验、IO 与真实停稳</text><text x="1170" y="540" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Guard → Release；oneshot 回复</text></g><g class="component" data-key="pending" tabindex="0" role="button" aria-label="② poll 到 Pending 时"><rect class="card" x="1150" y="675" width="372" height="135" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="1150" y="690" width="4" height="105" rx="2" fill="#172b45"/><text x="1170" y="707" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">② poll 到 Pending 时</text><text x="1170" y="737" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">① / 通知 / 外层仍可就绪</text><text x="1170" y="765" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">没有任何分支就绪则等待</text><text x="1170" y="793" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Activity 完成 ≠ Workflow 完成</text></g><path d="M570 335 L570 352" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-blue)"/><text x="588" y="345" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">poll</text><path d="M95 397 L95 514 L310 514 L310 535" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><path d="M1045 397 L1045 514 L805 514 L805 535" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><path d="M570 397 L570 410" fill="none" stroke="#172b45" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-ink)"/><text x="340" y="517" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">biased 检查顺序：通知 → ① → ②</text><path d="M320 645 L320 695" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="335" y="675" font-size="18" fill="#99611c" font-weight="400" text-anchor="start">处理事件</text><path d="M805 645 L805 695" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><text x="820" y="675" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">poll</text><path d="M585 735 L533 735" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="535" y="719" font-size="13" fill="#99611c" font-weight="400" text-anchor="start">Acquire</text><path d="M533 780 L585 780" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="535" y="803" font-size="13" fill="#99611c" font-weight="400" text-anchor="start">Permit</text><path d="M1030 735 L1105 735 L1105 300 L1150 300" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1045" y="670" font-size="18" fill="#237562" font-weight="400" text-anchor="start">Execute</text><path d="M1335 360 L1335 450" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1350" y="409" font-size="18" fill="#237562" font-weight="400" text-anchor="start">独立执行</text><path d="M1150 530 L1100 530 L1100 825 L805 825 L805 810" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="6" marker-end="url(#02-runtime-green)"/><text x="1128" y="615" font-size="18" fill="#237562" font-weight="400" text-anchor="start">回复 / Release → 唤醒等待链</text><text x="70" y="905" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">① 返回 None；② 仅 Workflow 整体完成返回 Some(TaskId)。两者返回后 publish，外层下一轮 reap / pump。</text><text x="70" y="942" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">通知支路也返回 None：暂停 ACK 后，即使 Workflow 仍 Pending，TaskCenter 也能重算并放行 topo。</text></svg></section><section data-page="2" hidden><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="03-scheduling-title"><title id="03-scheduling-title">调度交接：topo 到来，缩容何时真的让出？</title><defs><marker id="03-scheduling-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="03-scheduling-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="03-scheduling-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="03-scheduling-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="03-scheduling-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     03 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">调度交接：topo 到来，缩容何时真的让出？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">当前 ShrinkWorkflow 采用停稳返回；priority 与 YieldTo 共同避免三任务等待环。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><g class="component" data-key="lane180" tabindex="0" role="button" aria-label="调用方"><rect class="card" x="55" y="177" width="250" height="82" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="55" y="192" width="4" height="52" rx="2" fill="#172b45"/><text x="75" y="209" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">调用方</text></g><path d="M180 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane490" tabindex="0" role="button" aria-label="TaskCenter"><rect class="card" x="365" y="177" width="250" height="82" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="365" y="192" width="4" height="52" rx="2" fill="#2459aa"/><text x="385" y="209" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">TaskCenter</text></g><path d="M490 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane800" tabindex="0" role="button" aria-label="topo Workflow"><rect class="card" x="675" y="177" width="250" height="82" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="675" y="192" width="4" height="52" rx="2" fill="#2459aa"/><text x="695" y="209" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">topo Workflow</text></g><path d="M800 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane1110" tabindex="0" role="button" aria-label="缩容 Workflow"><rect class="card" x="985" y="177" width="250" height="82" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="985" y="192" width="4" height="52" rx="2" fill="#7055a2"/><text x="1005" y="209" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">缩容 Workflow</text></g><path d="M1110 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane1420" tabindex="0" role="button" aria-label="迁移服务"><rect class="card" x="1295" y="177" width="250" height="82" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1295" y="192" width="4" height="52" rx="2" fill="#237562"/><text x="1315" y="209" font-size="24" fill="#237562" font-weight="650" text-anchor="start">迁移服务</text></g><path d="M1420 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><path d="M180 300 L490 300" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="198" y="285" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">1 提交 topo；等待准入确认</text><path d="M490 370 L1110 370" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="355" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">2 Policy → YieldTo：加入 policy 暂停原因</text><path d="M1110 440 L1420 440" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-purple)"/><text x="1128" y="425" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">3 suspend：等待实际停稳</text><path d="M1420 510 L1110 510" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-green)"/><text x="1128" y="495" font-size="18" fill="#237562" font-weight="400" text-anchor="start">4 completion → Suspended(checkpoint)</text><path d="M1110 580 L490 580" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-purple)"/><text x="508" y="565" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">5 保存 checkpoint → wait_until_runnable → ACK</text><path d="M490 650 L800 650" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="635" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">6 发放 StartPermit</text><path d="M800 720 L490 720" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="705" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">7 topo 实际完成 / reap</text><path d="M490 790 L1110 790" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="775" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">8 移除该 topo 的暂停原因</text><text x="70" y="903" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">topo 尚未确认写入：不能抢占旧任务。暂停请求送达：不能当成缩容已停稳。</text><text x="70" y="941" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">priority：topo &gt; 其他 &gt; shrink；同级 FIFO。ACK 后 topo 可越过等待中的卷任务，运行占用仍须停稳。</text></svg></section><section data-page="3" hidden><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="04-pause-title"><title id="04-pause-title">同一个 Activity 接口，两种暂停契约</title><defs><marker id="04-pause-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="04-pause-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="04-pause-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="04-pause-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="04-pause-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     04 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">同一个 Activity 接口，两种暂停契约</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">上游 Workflow 选择语义；迁移服务仍通过普通 client / command 接口提供能力。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="175" width="730" height="682" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="70" y="210" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">A   保留调用   ·   await 暂不返回</text><rect x="822" y="175" width="730" height="682" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="844" y="210" font-size="21" fill="#237562" font-weight="650" text-anchor="start">B   当前 ShrinkWorkflow   ·   停稳后返回</text><g class="component" data-key="a1" tabindex="0" role="button" aria-label="1  普通 ctx.activity(...).await"><rect class="card" x="78" y="230" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="245" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="262" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">1  普通 ctx.activity(...).await</text><text x="98" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">服务注册默认 ActivityControl</text><text x="98" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Workflow 也可覆盖下一次调用</text></g><path d="M413 355 L413 381" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a2" tabindex="0" role="button" aria-label="2  收到暂停 → suspend 命令"><rect class="card" x="78" y="381" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="396" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="413" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">2  收到暂停 → suspend 命令</text><text x="98" y="443" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">适配器等待真实停稳 ACK</text><text x="98" y="471" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原 Activity Future 继续存在</text></g><path d="M413 506 L413 532" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a3" tabindex="0" role="button" aria-label="3  Task = Suspended"><rect class="card" x="78" y="532" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="547" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="564" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">3  Task = Suspended</text><text x="98" y="594" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原调用与资源锁保留</text><text x="98" y="622" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">TaskCenter 此时才可安全交接</text></g><path d="M413 657 L413 683" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a4" tabindex="0" role="button" aria-label="4  暂停原因清除 → guard 检查"><rect class="card" x="78" y="683" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="698" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="715" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">4  暂停原因清除 → guard 检查</text><text x="98" y="745" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不满足：WaitingConditions</text><text x="98" y="773" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">满足：调用所选 resume，原 await 继续</text></g><g class="component" data-key="b1" tabindex="0" role="button" aria-label="1  普通 ctx.activity(...).await"><rect class="card" x="852" y="230" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="245" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="262" font-size="24" fill="#237562" font-weight="650" text-anchor="start">1  普通 ctx.activity(...).await</text><text x="872" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">服务读取控制 token</text><text x="872" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">暂停时自行停止并结算已完成进度</text></g><path d="M1187 355 L1187 381" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b2" tabindex="0" role="button" aria-label="2  返回类型化部分结果"><rect class="card" x="852" y="381" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="396" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="413" font-size="24" fill="#237562" font-weight="650" text-anchor="start">2  返回类型化部分结果</text><text x="872" y="443" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原调用结束，只留下续作数据</text><text x="872" y="471" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">ActivityExit::Suspended(checkpoint)</text></g><path d="M1187 506 L1187 532" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b3" tabindex="0" role="button" aria-label="3  保存 checkpoint，再确认暂停"><rect class="card" x="852" y="532" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="547" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="564" font-size="24" fill="#237562" font-weight="650" text-anchor="start">3  保存 checkpoint，再确认暂停</text><text x="872" y="594" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Workflow 保存进度，再确认 Task 暂停</text><text x="872" y="622" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">已结束 Activity 释放其资源</text></g><path d="M1187 657 L1187 683" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b4" tabindex="0" role="button" aria-label="4  暂停原因清除 → guard 检查"><rect class="card" x="852" y="683" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="698" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="715" font-size="24" fill="#237562" font-weight="650" text-anchor="start">4  暂停原因清除 → guard 检查</text><text x="872" y="745" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">满足后 Workflow 发起下一次 Activity</text><text x="872" y="773" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">仍然使用同一个 TaskId</text></g><text x="70" y="902" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">没有暂停能力的服务：等动作自然完成。控制失败 / 结果不确定：保留隔离，不伪造停稳。</text><text x="70" y="940" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">A 保留资源锁；若 topo 需要同一资源，需选择 B 或重新定义符合实际的资源范围。</text></svg></section><section data-page="4" hidden><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="05-recovery-title"><title id="05-recovery-title">持久化与切主：重建同一个 Task，继续业务</title><defs><marker id="05-recovery-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="05-recovery-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="05-recovery-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="05-recovery-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="05-recovery-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     05 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">持久化与切主：重建同一个 Task，继续业务</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">可恢复的是显式业务 checkpoint；不是序列化 Rust Future，也不是 Temporal 确定性重放。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="175" width="710" height="670" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="210" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">正常运行   ·   Workflow 自声明 Memory / Durable</text><rect x="800" y="175" width="752" height="670" rx="18" fill="#fcf5e9" stroke="#99611c" stroke-opacity=".3"/><text x="822" y="210" font-size="21" fill="#99611c" font-weight="650" text-anchor="start">新主恢复   ·   先 fencing，再恢复，再开放准入</text><g class="component" data-key="persist" tabindex="0" role="button" aria-label="Workflow::persistence()"><rect class="card" x="78" y="230" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="245" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="262" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">Workflow::persistence()</text><text x="98" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">默认 Memory：仍有完整 Task</text><text x="98" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Durable：声明 version + input</text></g><path d="M403.0 350 L403.0 375" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="journal" tabindex="0" role="button" aria-label="Journal → TaskStore"><rect class="card" x="78" y="375" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="390" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="407" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">Journal → TaskStore</text><text x="98" y="437" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">初始保存确认后才执行 / 激活调度</text><text x="98" y="465" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">checkpoint、details、控制意图、终态</text></g><path d="M403.0 495 L403.0 520" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="cas" tabindex="0" role="button" aria-label="TaskStore 写入约束"><rect class="card" x="78" y="520" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="535" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="552" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">TaskStore 写入约束</text><text x="98" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">owner_epoch 校验旧主；revision CAS</text><text x="98" y="610" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">存储写入通过 spawn_blocking 等待</text></g><path d="M403.0 640 L403.0 665" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="outcome" tabindex="0" role="button" aria-label="中断 / 完成记录"><rect class="card" x="78" y="665" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="680" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="697" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">中断 / 完成记录</text><text x="98" y="727" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">停稳中断 Pending；用户取消 Cancelled</text><text x="98" y="755" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不确定效果 NeedsCheck，需对账</text></g><g class="component" data-key="fence" tabindex="0" role="button" aria-label="1  外部选主 / 领域恢复"><rect class="card" x="830" y="230" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="245" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="262" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">1  外部选主 / 领域恢复</text><text x="850" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">新轮次严格递增；阻止旧主数据面写入</text><text x="850" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">恢复领域状态，再绑定当前服务客户端</text></g><path d="M1176.0 350 L1176.0 375" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="define" tabindex="0" role="button" aria-label="2  define → enable_persistence"><rect class="card" x="830" y="375" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="390" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="407" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">2  define → enable_persistence</text><text x="850" y="437" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">绑定 Workflow::restore 与 dependencies</text><text x="850" y="465" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">claim(pool, epoch)；普通准入保持关闭</text></g><path d="M1176.0 495 L1176.0 520" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="restore" tabindex="0" role="button" aria-label="3  restore 全量预检与 CAS 接管"><rect class="card" x="830" y="520" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="535" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="552" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">3  restore 全量预检与 CAS 接管</text><text x="850" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">校验类型 / input / version / objects</text><text x="850" y="610" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">未知类型或需对账记录：停止恢复</text></g><path d="M1176.0 640 L1176.0 665" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="install" tabindex="0" role="button" aria-label="4  from_restored → guard → 执行"><rect class="card" x="830" y="665" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="680" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="697" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">4  from_restored → guard → 执行</text><text x="850" y="727" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">一次安装全部任务占用，再放行许可</text><text x="850" y="755" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户暂停恢复；policy 原因重新计算</text></g><text x="70" y="891" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">TaskId 不变：创建轮次 / 池 UUID / 业务 / 流水；接管后只改变 owner_epoch 和 revision。</text><text x="70" y="932" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">动作已完成但 checkpoint 未写入：由稳定操作 ID、幂等命令或领域对账处理；框架不自动重放。</text></svg></section><section data-page="5" hidden><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="06-observation-title"><title id="06-observation-title">观察与控制：所有入口指向同一个 Task</title><defs><marker id="06-observation-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="06-observation-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="06-observation-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="06-observation-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="06-observation-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     06 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">观察与控制：所有入口指向同一个 Task</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">Run 是类型化结果句柄；Snapshot 是观察快照；SavedTask 是存储表示。它们不会生成新的 TaskId。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><g class="component" data-key="caller" tabindex="0" role="button" aria-label="用户 / 调度策略 / 业务事件"><rect class="card" x="48" y="200" width="400" height="155" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="48" y="215" width="4" height="125" rx="2" fill="#2459aa"/><text x="68" y="232" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">用户 / 调度策略 / 业务事件</text><text x="68" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户：suspend / resume / cancel</text><text x="68" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">策略：维护各自的暂停原因</text><text x="68" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">业务：条件变化后 recheck</text></g><g class="component" data-key="control" tabindex="0" role="button" aria-label="RunControl / ControlToken"><rect class="card" x="545" y="200" width="510" height="155" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="545" y="215" width="4" height="125" rx="2" fill="#7055a2"/><text x="565" y="232" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">RunControl / ControlToken</text><text x="565" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">请求 ≠ 确认；控制代次使旧 ACK 失效</text><text x="565" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户原因与 policy 原因独立</text><text x="565" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">wait_suspended 等实际停稳</text></g><g class="component" data-key="actor" tabindex="0" role="button" aria-label="Workflow / Activity"><rect class="card" x="1150" y="200" width="402" height="155" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="215" width="4" height="125" rx="2" fill="#237562"/><text x="1170" y="232" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Workflow / Activity</text><text x="1170" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Driver 处理控制与条件检查</text><text x="1170" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域执行者确认停稳 / 返回结果</text><text x="1170" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">取消也必须等待实际动作结束</text></g><path d="M448 270 L545 270" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-blue)"/><text x="468" y="253" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">请求</text><path d="M1055 270 L1150 270" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-purple)"/><text x="1076" y="253" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">交付</text><rect x="48" y="425" width="1504" height="355" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="70" y="460" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">同一个 Task   ·   上排：TaskSnapshot 内容；下排：访问句柄与存储表示</text><g class="component" data-key="identity" tabindex="0" role="button" aria-label="身份与结果状态"><rect class="card" x="78" y="490" width="440" height="110" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="505" width="4" height="80" rx="2" fill="#7055a2"/><text x="98" y="522" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">身份与结果状态</text><text x="98" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">TaskId / name / objects / RunState</text><text x="98" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">progress / cancellation_requested</text></g><g class="component" data-key="pauses" tabindex="0" role="button" aria-label="调度与暂停"><rect class="card" x="580" y="490" width="440" height="110" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="580" y="505" width="4" height="80" rx="2" fill="#2459aa"/><text x="600" y="522" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">调度与暂停</text><text x="600" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">conflicts：准入时解释</text><text x="600" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">blockers / suspend_reasons / ACK</text></g><g class="component" data-key="details" tabindex="0" role="button" aria-label="业务与步骤观察"><rect class="card" x="1080" y="490" width="442" height="110" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1080" y="505" width="4" height="80" rx="2" fill="#237562"/><text x="1100" y="522" font-size="24" fill="#237562" font-weight="650" text-anchor="start">业务与步骤观察</text><text x="1100" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">details：类型化业务附加信息</text><text x="1100" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">activities：当前宿主内调用历史</text></g><g class="component" data-key="view" tabindex="0" role="button" aria-label="ExecutionView / TaskObserver"><rect class="card" x="78" y="645" width="440" height="104" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="660" width="4" height="74" rx="2" fill="#7055a2"/><text x="98" y="677" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">ExecutionView / TaskObserver</text><text x="98" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一快照；watch 可合并更新</text><text x="98" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不是无损事件日志</text></g><g class="component" data-key="saved" tabindex="0" role="button" aria-label="SavedTask / TaskStore"><rect class="card" x="580" y="645" width="440" height="104" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="580" y="660" width="4" height="74" rx="2" fill="#99611c"/><text x="600" y="677" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">SavedTask / TaskStore</text><text x="600" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一 ID 的可选恢复记录</text><text x="600" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不持久化 Activity 历史 / Rust 栈</text></g><g class="component" data-key="run" tabindex="0" role="button" aria-label="Run&lt;T&gt;"><rect class="card" x="1080" y="645" width="442" height="104" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="1080" y="660" width="4" height="74" rx="2" fill="#172b45"/><text x="1100" y="677" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">Run&lt;T&gt;</text><text x="1100" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">accepted()：提交确认</text><text x="1100" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">result()：本次执行的类型化结果</text></g><path d="M800 355 L800 425" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-purple)"/><text x="820" y="398" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">控制、进度、调度解释更新同一个观察模型</text><text x="70" y="837" font-size="20" fill="#2459aa" font-weight="400" text-anchor="start">新任务身份：epoch / pool UUID / business / sequence；同一主共享序号分配器。</text><text x="70" y="880" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">PoolManager 的 TaskRef 包含池实例路由信息；PoolTaskSnapshot 包装同一个快照，不是另一套任务。</text><text x="70" y="928" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">终态：Tracker 停稳 → Durable 保存结果 → 发布结果 → State 回收；Uncertain 继续隔离。</text></svg></section></main><aside><div class="eyebrow">READING PATH / 阅读路径</div><h2 id="heading"></h2><div id="steps" aria-label="阅读步骤"></div><p id="description" aria-live="polite"></p><button id="reset">显示全部组件</button><div id="detail"><div class="eyebrow">COMPONENT / 组件职责</div><h3 id="component-title">点击图中组件</h3><p id="component-body">选中一个组件，查看它的职责以及与执行机制的关系。</p></div><footer>教学图示，不执行真实任务。迁移仍为模拟接入；Task checkpoint 恢复不等于完整生产容灾。</footer></aside></div><script>
const pages=[{"slug": "01-layers", "title": "逻辑分层：谁决定业务，谁负责推进？", "subtitle": "先认清职责。层是代码职责边界，不代表进程、线程或独立服务部署。", "components": {"root": {"title": "Pool / 组合根", "detail": "装配 TaskCenter、客户端、依赖；新主轮次由外部选主系统提供"}, "entry": {"title": "PoolHandle / 业务调用方", "detail": "提交 Workflow；按 TaskId 管理；一个主的各池共享 TaskIds"}, "defs": {"title": "Workflow 类型定义", "detail": "声明 input、details、persistence；需要恢复的类型绑定 dependencies"}, "wf": {"title": "业务 Workflow", "detail": "组织步骤与 checkpoint；RunCondition 定义继续条件"}, "policy": {"title": "SchedulingPolicy", "detail": "准入决策 + 有方向的运行关系；优先级 + 让位关系；可替换策略"}, "center": {"title": "TaskCenter / State", "detail": "队列、占用、隔离、启动许可；计算暂停原因；等待真实 ACK"}, "driver": {"title": "WorkflowDriver", "detail": "由 TaskCenter 轮询 Future 集合；不是额外的 Tokio task"}, "context": {"title": "WorkflowContext", "detail": "Activity / wait_until_runnable / 控制；资源申请、停稳跟踪、续跑记录"}, "index": {"title": "TaskRegistry / ExecutionView", "detail": "同一个 Task 的观察与控制入口；Snapshot / Observer / RunControl"}, "host": {"title": "ServiceHost / ServiceHandler", "detail": "邮箱 + Activity Futures；每个服务有独立 Tokio 宿主"}, "domain": {"title": "Disk / Node / VD / Migration", "detail": "命令校验、状态和实际业务动作；迁移示例也通过普通 client 接入"}, "ports": {"title": "Ports / Adapters", "detail": "元数据、数据面等外部接口；领域停稳确认来自真实执行"}, "store": {"title": "TaskStore", "detail": "同一个 Task 的存储表示；epoch fencing + revision CAS"}, "io": {"title": "数据面 / 元数据后端", "detail": "执行真实 IO 与领域状态提交；TaskStore 不能替代数据面 fencing"}, "scope": {"title": "当前实现范围", "detail": "领域侧仍为模拟；无确定性重放；完整跨主接入需领域恢复与对账"}}, "steps": [{"title": "从业务定义开始", "body": "Workflow 决定步骤、持久化和续跑条件；策略决定不同任务如何共存。", "keys": ["wf", "policy", "defs"]}, {"title": "TaskCenter 负责协调", "body": "维护队列与占用，按策略发控制请求；拿到真实停稳 ACK 后才能交接。", "keys": ["center"]}, {"title": "Driver 负责推进", "body": "Driver 只是可轮询的执行集合，嵌在 TaskCenter 循环内；Context 连接 Workflow 与领域客户端。", "keys": ["driver", "context"]}, {"title": "服务执行实际动作", "body": "各服务宿主独立接收命令，领域校验与真实停稳属于服务。", "keys": ["host", "domain", "ports"]}, {"title": "观察和存储属于同一任务", "body": "所有 Workflow 都有 Task；持久化只改变该 Task 是否保存恢复记录。", "keys": ["index", "store", "scope"]}]}, {"slug": "02-runtime", "title": "Driver tick：两个工作分支，分别何时返回？", "subtitle": "同一个宿主内的 select，不是两个 worker，也不是每轮先资源、再工作流各执行一次。", "components": {"state": {"title": "外层循环：reap → pump → select", "detail": "处理提交 / shutdown / 提交确认回执 / driver.tick()；tick 返回 Some 或 None 都回到外层重新规划；外层其他分支也可就绪"}, "notify": {"title": "通知支路：wake.notified() → None", "detail": "控制 / ACK 变化通知外层重算；与 Permit / 服务回复的 Waker 不同"}, "resource": {"title": "① events.recv()", "detail": "table.event(event, &broker)；消费一条事件 → publish → None"}, "future": {"title": "② running.next()", "detail": "poll 就绪的 Workflow Futures；整体完成 → finish(id) → Some(id)"}, "locks": {"title": "Broker / 队列 / LockTable", "detail": "Acquire / Release / Withdraw；许可、等待、释放、隔离"}, "context": {"title": "WorkflowContext / ActivityClient", "detail": "await Pending：② 尚未就绪；许可或回复唤醒后才再次 poll"}, "mail": {"title": "服务邮箱 / ServiceHost", "detail": "Execute + Context + Guard；登记并轮询 Activity Futures"}, "domain": {"title": "Handler → Service → Ports", "detail": "领域校验、IO 与真实停稳；Guard → Release；oneshot 回复"}, "pending": {"title": "② poll 到 Pending 时", "detail": "① / 通知 / 外层仍可就绪；没有任何分支就绪则等待；Activity 完成 ≠ Workflow 完成"}}, "steps": [{"title": "外层是谁", "body": "每池一个 TaskCenter Tokio task。State 是应用协调；Driver 嵌在外层 select 中。", "keys": ["state"]}, {"title": "① 资源分支", "body": "events.recv 就绪后修改 LockTable，publish 并返回 None。Broker 的消息不是直接修改锁表。", "keys": ["resource", "locks"]}, {"title": "② Future 分支", "body": "running.next 轮询就绪 Future。Pending 不进入完成分支体；只有整个流程返回 TaskId 才 finish 并返回 Some。", "keys": ["future", "context", "pending"]}, {"title": "Pending 时切换分支", "body": "Workflow 投递 Acquire 后等 Permit；① 消费事件并返回 None；再次 poll ② 后才继续派发 Execute。", "keys": ["resource", "future", "context", "locks"]}, {"title": "服务独立执行", "body": "服务在另一个 Tokio task 中推进。回复仅唤醒原等待链；Release 仍由①消费。", "keys": ["mail", "domain", "context"]}, {"title": "通知返回外层", "body": "Controls 的 wake.notified 使 tick 返回 None，ACK 后外层及时 pump；不能把这条通知等同于普通 Waker。", "keys": ["notify", "state"]}]}, {"slug": "03-scheduling", "title": "调度交接：topo 到来，缩容何时真的让出？", "subtitle": "当前 ShrinkWorkflow 采用停稳返回；priority 与 YieldTo 共同避免三任务等待环。", "components": {"lane180": {"title": "调用方", "detail": ""}, "lane490": {"title": "TaskCenter", "detail": ""}, "lane800": {"title": "topo Workflow", "detail": ""}, "lane1110": {"title": "缩容 Workflow", "detail": ""}, "lane1420": {"title": "迁移服务", "detail": ""}}, "steps": [{"title": "topo 准入", "body": "检查全部冲突与容量；Durable 的初始记录成功后，任务才激活调度。", "keys": ["lane180", "lane490"]}, {"title": "策略产生暂停原因", "body": "默认策略将缩容对 topo 的关系定义为 YieldTo。多个 topo 各自形成原因。", "keys": ["lane490", "lane1110"]}, {"title": "领域确认停稳", "body": "BalanceHost 读取控制 token，调用 C suspend 后继续等待 completion。仅发送命令不构成停稳。", "keys": ["lane1110", "lane1420"]}, {"title": "确认后交接", "body": "TaskCenter 使用当前控制代次的有效 ACK 重新规划，才发放 topo 的启动许可。", "keys": ["lane490", "lane1110"]}, {"title": "恢复仍要检查", "body": "topo 完成只清除自身原因。用户暂停还在就继续等；条件未满足则 WaitingConditions。", "keys": ["lane1110", "lane1420"]}]}, {"slug": "04-pause", "title": "同一个 Activity 接口，两种暂停契约", "subtitle": "上游 Workflow 选择语义；迁移服务仍通过普通 client / command 接口提供能力。", "components": {"a1": {"title": "1  普通 ctx.activity(...).await", "detail": "服务注册默认 ActivityControl；Workflow 也可覆盖下一次调用"}, "a2": {"title": "2  收到暂停 → suspend 命令", "detail": "适配器等待真实停稳 ACK；原 Activity Future 继续存在"}, "a3": {"title": "3  Task = Suspended", "detail": "原调用与资源锁保留；TaskCenter 此时才可安全交接"}, "a4": {"title": "4  暂停原因清除 → guard 检查", "detail": "不满足：WaitingConditions；满足：调用所选 resume，原 await 继续"}, "b1": {"title": "1  普通 ctx.activity(...).await", "detail": "服务读取控制 token；暂停时自行停止并结算已完成进度"}, "b2": {"title": "2  返回类型化部分结果", "detail": "原调用结束，只留下续作数据；ActivityExit::Suspended(checkpoint)"}, "b3": {"title": "3  保存 checkpoint，再确认暂停", "detail": "Workflow 保存进度，再确认 Task 暂停；已结束 Activity 释放其资源"}, "b4": {"title": "4  暂停原因清除 → guard 检查", "detail": "满足后 Workflow 发起下一次 Activity；仍然使用同一个 TaskId"}}, "steps": [{"title": "仍然只有普通 Activity", "body": "两种方式都用 ctx.activity。上游可以选择不同 suspend/resume 命令，不新增 Activity 类型。", "keys": ["a1", "b1"]}, {"title": "await 是否返回", "body": "A 等最终业务结果；B 停稳后返回领域定义的部分结果，Workflow 有机会保存续跑数据。", "keys": ["a2", "b2"]}, {"title": "何时确认 Task 暂停", "body": "A 是停稳适配器 ACK；B 是 Workflow 消费结果、保存 checkpoint 后进入 wait_until_runnable。", "keys": ["a3", "b3"]}, {"title": "恢复前重新准入", "body": "guard 属于 Workflow。条件变化用 recheck 唤醒；检查通过后才继续迁移。", "keys": ["a4", "b4"]}]}, {"slug": "05-recovery", "title": "持久化与切主：重建同一个 Task，继续业务", "subtitle": "可恢复的是显式业务 checkpoint；不是序列化 Rust Future，也不是 Temporal 确定性重放。", "components": {"persist": {"title": "Workflow::persistence()", "detail": "默认 Memory：仍有完整 Task；Durable：声明 version + input"}, "journal": {"title": "Journal → TaskStore", "detail": "初始保存确认后才执行 / 激活调度；checkpoint、details、控制意图、终态"}, "cas": {"title": "TaskStore 写入约束", "detail": "owner_epoch 校验旧主；revision CAS；存储写入通过 spawn_blocking 等待"}, "outcome": {"title": "中断 / 完成记录", "detail": "停稳中断 Pending；用户取消 Cancelled；不确定效果 NeedsCheck，需对账"}, "fence": {"title": "1  外部选主 / 领域恢复", "detail": "新轮次严格递增；阻止旧主数据面写入；恢复领域状态，再绑定当前服务客户端"}, "define": {"title": "2  define → enable_persistence", "detail": "绑定 Workflow::restore 与 dependencies；claim(pool, epoch)；普通准入保持关闭"}, "restore": {"title": "3  restore 全量预检与 CAS 接管", "detail": "校验类型 / input / version / objects；未知类型或需对账记录：停止恢复"}, "install": {"title": "4  from_restored → guard → 执行", "detail": "一次安装全部任务占用，再放行许可；用户暂停恢复；policy 原因重新计算"}}, "steps": [{"title": "持久性由 Workflow 决定", "body": "Memory 和 Durable 是同一 Task 管理模型。Durable 需要输入版本和 restore 构造。", "keys": ["persist"]}, {"title": "保存续跑状态", "body": "report_details 更新观察；save_checkpoint 保存进度及 details。取消意图写盘后才交付取消令牌。", "keys": ["journal", "cas", "outcome"]}, {"title": "外部选主是前提", "body": "所有池共享新轮次 TaskIds；TaskStore fencing 不能替代数据面 fencing 和领域状态恢复。", "keys": ["fence"]}, {"title": "全量预检与接管", "body": "restore 在打开任何流程前校验全部待恢复记录，更新 owner_epoch/revision，保留原 TaskId。", "keys": ["define", "restore"]}, {"title": "恢复原任务", "body": "TaskCenter 安装所有占用再启动。Workflow 从 checkpoint 继续；用户暂停和业务 guard 仍有效。", "keys": ["install"]}]}, {"slug": "06-observation", "title": "观察与控制：所有入口指向同一个 Task", "subtitle": "Run 是类型化结果句柄；Snapshot 是观察快照；SavedTask 是存储表示。它们不会生成新的 TaskId。", "components": {"caller": {"title": "用户 / 调度策略 / 业务事件", "detail": "用户：suspend / resume / cancel；策略：维护各自的暂停原因；业务：条件变化后 recheck"}, "control": {"title": "RunControl / ControlToken", "detail": "请求 ≠ 确认；控制代次使旧 ACK 失效；用户原因与 policy 原因独立；wait_suspended 等实际停稳"}, "actor": {"title": "Workflow / Activity", "detail": "Driver 处理控制与条件检查；领域执行者确认停稳 / 返回结果；取消也必须等待实际动作结束"}, "identity": {"title": "身份与结果状态", "detail": "TaskId / name / objects / RunState；progress / cancellation_requested"}, "pauses": {"title": "调度与暂停", "detail": "conflicts：准入时解释；blockers / suspend_reasons / ACK"}, "details": {"title": "业务与步骤观察", "detail": "details：类型化业务附加信息；activities：当前宿主内调用历史"}, "view": {"title": "ExecutionView / TaskObserver", "detail": "同一快照；watch 可合并更新；不是无损事件日志"}, "saved": {"title": "SavedTask / TaskStore", "detail": "同一 ID 的可选恢复记录；不持久化 Activity 历史 / Rust 栈"}, "run": {"title": "Run<T>", "detail": "accepted()：提交确认；result()：本次执行的类型化结果"}}, "steps": [{"title": "请求进入同一控制对象", "body": "用户控制和策略控制是不同原因。resume 只去掉用户原因，不越过仍存在的 topo 阻塞。", "keys": ["caller", "control"]}, {"title": "实际执行决定确认", "body": "命令送达不代表完成。Workflow/Activity 的停稳状态决定 pause ACK 和最终结果。", "keys": ["actor"]}, {"title": "统一观察", "body": "任务状态、业务 details、调度解释、Activity 历史汇集到一个 TaskSnapshot。", "keys": ["identity", "pauses", "details"]}, {"title": "不同入口，没有新任务", "body": "Observer 观察、Run 等结果、SavedTask 用于恢复；全部指向同一 TaskId。", "keys": ["view", "saved", "run"]}]}];let current=0,scale=1,step=-1;
const $=id=>document.getElementById(id);
function highlight(keys){const groups=document.querySelectorAll('section:not([hidden]) .component');groups.forEach(g=>{g.classList.toggle('active',keys.includes(g.dataset.key));g.classList.toggle('dim',keys.length>0&&!keys.includes(g.dataset.key))})}
function selectStep(i){step=i;const s=pages[current].steps[i];$('description').textContent=s.title+'：'+s.body;highlight(s.keys);document.querySelectorAll('#steps button').forEach((b,n)=>b.setAttribute('aria-current',String(i===n)))}
function show(i){current=Math.max(0,Math.min(pages.length-1,i));step=-1;document.querySelectorAll('section').forEach((s,n)=>s.hidden=n!==current);document.querySelectorAll('nav button').forEach((b,n)=>b.setAttribute('aria-current',String(n===current)));$('heading').textContent=pages[current].title;$('description').textContent=pages[current].subtitle;$('steps').replaceChildren(...pages[current].steps.map((s,n)=>{const b=document.createElement('button');b.textContent=n+1;b.title=s.title;b.addEventListener('click',()=>selectStep(n));return b}));$('source').href=pages[current].slug+'.svg';$('prev').disabled=current===0;$('next').disabled=current===pages.length-1;$('component-title').textContent='点击图中组件';$('component-body').textContent='或按右侧步骤高亮运行路径。';highlight([]);zoom(1);$('viewport').scrollTo(0,0)}
function zoom(n){scale=Math.max(.5,Math.min(2.5,n));document.querySelectorAll('section').forEach(s=>s.style.width=(scale*100)+'%');$('zoom').textContent=Math.round(scale*100)+'%'}
document.querySelectorAll('nav button').forEach((b,i)=>b.addEventListener('click',()=>show(i)));
document.querySelectorAll('.component').forEach(g=>{const select=()=>{const c=pages[current].components[g.dataset.key];$('component-title').textContent=c.title;$('component-body').textContent=c.detail;highlight([g.dataset.key])};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('plus').onclick=()=>zoom(scale+.25);$('minus').onclick=()=>zoom(scale-.25);$('fit').onclick=()=>zoom(1);$('reset').onclick=()=>{highlight([]);step=-1;document.querySelectorAll('#steps button').forEach(b=>b.setAttribute('aria-current','false'));$('description').textContent=pages[current].subtitle};$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
window.Guide={show,selectStep,inspect:()=>({current,scale,step,pages:pages.length})};show(0);
</script></body></html>
