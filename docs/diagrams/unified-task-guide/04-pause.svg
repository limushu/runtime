<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="04-pause-title"><title id="04-pause-title">同一个 Activity 接口，两种暂停契约</title><defs><marker id="04-pause-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="04-pause-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="04-pause-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="04-pause-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="04-pause-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     04 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">同一个 Activity 接口，两种暂停契约</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">上游 Workflow 选择语义；迁移服务仍通过普通 client / command 接口提供能力。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="175" width="730" height="682" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="70" y="210" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">A   保留调用   ·   await 暂不返回</text><rect x="822" y="175" width="730" height="682" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="844" y="210" font-size="21" fill="#237562" font-weight="650" text-anchor="start">B   当前 ShrinkWorkflow   ·   停稳后返回</text><g class="component" data-key="a1" tabindex="0" role="button" aria-label="1  普通 ctx.activity(...).await"><rect class="card" x="78" y="230" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="245" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="262" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">1  普通 ctx.activity(...).await</text><text x="98" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">服务注册默认 ActivityControl</text><text x="98" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Workflow 也可覆盖下一次调用</text></g><path d="M413 355 L413 381" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a2" tabindex="0" role="button" aria-label="2  收到暂停 → suspend 命令"><rect class="card" x="78" y="381" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="396" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="413" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">2  收到暂停 → suspend 命令</text><text x="98" y="443" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">适配器等待真实停稳 ACK</text><text x="98" y="471" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原 Activity Future 继续存在</text></g><path d="M413 506 L413 532" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a3" tabindex="0" role="button" aria-label="3  Task = Suspended"><rect class="card" x="78" y="532" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="547" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="564" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">3  Task = Suspended</text><text x="98" y="594" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原调用与资源锁保留</text><text x="98" y="622" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">TaskCenter 此时才可安全交接</text></g><path d="M413 657 L413 683" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-purple)"/><g class="component" data-key="a4" tabindex="0" role="button" aria-label="4  暂停原因清除 → guard 检查"><rect class="card" x="78" y="683" width="670" height="125" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="698" width="4" height="95" rx="2" fill="#7055a2"/><text x="98" y="715" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">4  暂停原因清除 → guard 检查</text><text x="98" y="745" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不满足：WaitingConditions</text><text x="98" y="773" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">满足：调用所选 resume，原 await 继续</text></g><g class="component" data-key="b1" tabindex="0" role="button" aria-label="1  普通 ctx.activity(...).await"><rect class="card" x="852" y="230" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="245" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="262" font-size="24" fill="#237562" font-weight="650" text-anchor="start">1  普通 ctx.activity(...).await</text><text x="872" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">服务读取控制 token</text><text x="872" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">暂停时自行停止并结算已完成进度</text></g><path d="M1187 355 L1187 381" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b2" tabindex="0" role="button" aria-label="2  返回类型化部分结果"><rect class="card" x="852" y="381" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="396" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="413" font-size="24" fill="#237562" font-weight="650" text-anchor="start">2  返回类型化部分结果</text><text x="872" y="443" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">原调用结束，只留下续作数据</text><text x="872" y="471" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">ActivityExit::Suspended(checkpoint)</text></g><path d="M1187 506 L1187 532" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b3" tabindex="0" role="button" aria-label="3  保存 checkpoint，再确认暂停"><rect class="card" x="852" y="532" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="547" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="564" font-size="24" fill="#237562" font-weight="650" text-anchor="start">3  保存 checkpoint，再确认暂停</text><text x="872" y="594" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Workflow 保存进度，再确认 Task 暂停</text><text x="872" y="622" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">已结束 Activity 释放其资源</text></g><path d="M1187 657 L1187 683" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#04-pause-green)"/><g class="component" data-key="b4" tabindex="0" role="button" aria-label="4  暂停原因清除 → guard 检查"><rect class="card" x="852" y="683" width="670" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="852" y="698" width="4" height="95" rx="2" fill="#237562"/><text x="872" y="715" font-size="24" fill="#237562" font-weight="650" text-anchor="start">4  暂停原因清除 → guard 检查</text><text x="872" y="745" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">满足后 Workflow 发起下一次 Activity</text><text x="872" y="773" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">仍然使用同一个 TaskId</text></g><text x="70" y="902" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">没有暂停能力的服务：等动作自然完成。控制失败 / 结果不确定：保留隔离，不伪造停稳。</text><text x="70" y="940" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">A 保留资源锁；若 topo 需要同一资源，需选择 B 或重新定义符合实际的资源范围。</text></svg>