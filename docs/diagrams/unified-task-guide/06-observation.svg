<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="06-observation-title"><title id="06-observation-title">观察与控制：所有入口指向同一个 Task</title><defs><marker id="06-observation-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="06-observation-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="06-observation-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="06-observation-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="06-observation-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     06 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">观察与控制：所有入口指向同一个 Task</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">Run 是类型化结果句柄；Snapshot 是观察快照；SavedTask 是存储表示。它们不会生成新的 TaskId。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><g class="component" data-key="caller" tabindex="0" role="button" aria-label="用户 / 调度策略 / 业务事件"><rect class="card" x="48" y="200" width="400" height="155" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="48" y="215" width="4" height="125" rx="2" fill="#2459aa"/><text x="68" y="232" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">用户 / 调度策略 / 业务事件</text><text x="68" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户：suspend / resume / cancel</text><text x="68" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">策略：维护各自的暂停原因</text><text x="68" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">业务：条件变化后 recheck</text></g><g class="component" data-key="control" tabindex="0" role="button" aria-label="RunControl / ControlToken"><rect class="card" x="545" y="200" width="510" height="155" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="545" y="215" width="4" height="125" rx="2" fill="#7055a2"/><text x="565" y="232" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">RunControl / ControlToken</text><text x="565" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">请求 ≠ 确认；控制代次使旧 ACK 失效</text><text x="565" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户原因与 policy 原因独立</text><text x="565" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">wait_suspended 等实际停稳</text></g><g class="component" data-key="actor" tabindex="0" role="button" aria-label="Workflow / Activity"><rect class="card" x="1150" y="200" width="402" height="155" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="215" width="4" height="125" rx="2" fill="#237562"/><text x="1170" y="232" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Workflow / Activity</text><text x="1170" y="262" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Driver 处理控制与条件检查</text><text x="1170" y="290" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域执行者确认停稳 / 返回结果</text><text x="1170" y="318" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">取消也必须等待实际动作结束</text></g><path d="M448 270 L545 270" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-blue)"/><text x="468" y="253" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">请求</text><path d="M1055 270 L1150 270" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-purple)"/><text x="1076" y="253" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">交付</text><rect x="48" y="425" width="1504" height="355" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="70" y="460" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">同一个 Task   ·   上排：TaskSnapshot 内容；下排：访问句柄与存储表示</text><g class="component" data-key="identity" tabindex="0" role="button" aria-label="身份与结果状态"><rect class="card" x="78" y="490" width="440" height="110" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="505" width="4" height="80" rx="2" fill="#7055a2"/><text x="98" y="522" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">身份与结果状态</text><text x="98" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">TaskId / name / objects / RunState</text><text x="98" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">progress / cancellation_requested</text></g><g class="component" data-key="pauses" tabindex="0" role="button" aria-label="调度与暂停"><rect class="card" x="580" y="490" width="440" height="110" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="580" y="505" width="4" height="80" rx="2" fill="#2459aa"/><text x="600" y="522" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">调度与暂停</text><text x="600" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">conflicts：准入时解释</text><text x="600" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">blockers / suspend_reasons / ACK</text></g><g class="component" data-key="details" tabindex="0" role="button" aria-label="业务与步骤观察"><rect class="card" x="1080" y="490" width="442" height="110" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1080" y="505" width="4" height="80" rx="2" fill="#237562"/><text x="1100" y="522" font-size="24" fill="#237562" font-weight="650" text-anchor="start">业务与步骤观察</text><text x="1100" y="552" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">details：类型化业务附加信息</text><text x="1100" y="580" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">activities：当前宿主内调用历史</text></g><g class="component" data-key="view" tabindex="0" role="button" aria-label="ExecutionView / TaskObserver"><rect class="card" x="78" y="645" width="440" height="104" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="78" y="660" width="4" height="74" rx="2" fill="#7055a2"/><text x="98" y="677" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">ExecutionView / TaskObserver</text><text x="98" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一快照；watch 可合并更新</text><text x="98" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不是无损事件日志</text></g><g class="component" data-key="saved" tabindex="0" role="button" aria-label="SavedTask / TaskStore"><rect class="card" x="580" y="645" width="440" height="104" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="580" y="660" width="4" height="74" rx="2" fill="#99611c"/><text x="600" y="677" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">SavedTask / TaskStore</text><text x="600" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一 ID 的可选恢复记录</text><text x="600" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不持久化 Activity 历史 / Rust 栈</text></g><g class="component" data-key="run" tabindex="0" role="button" aria-label="Run&lt;T&gt;"><rect class="card" x="1080" y="645" width="442" height="104" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="1080" y="660" width="4" height="74" rx="2" fill="#172b45"/><text x="1100" y="677" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">Run&lt;T&gt;</text><text x="1100" y="707" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">accepted()：提交确认</text><text x="1100" y="735" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">result()：本次执行的类型化结果</text></g><path d="M800 355 L800 425" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#06-observation-purple)"/><text x="820" y="398" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">控制、进度、调度解释更新同一个观察模型</text><text x="70" y="837" font-size="20" fill="#2459aa" font-weight="400" text-anchor="start">新任务身份：epoch / pool UUID / business / sequence；同一主共享序号分配器。</text><text x="70" y="880" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">PoolManager 的 TaskRef 包含池实例路由信息；PoolTaskSnapshot 包装同一个快照，不是另一套任务。</text><text x="70" y="928" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">终态：Tracker 停稳 → Durable 保存结果 → 发布结果 → State 回收；Uncertain 继续隔离。</text></svg>