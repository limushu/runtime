<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="03-scheduling-title"><title id="03-scheduling-title">调度交接：topo 到来，缩容何时真的让出？</title><defs><marker id="03-scheduling-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="03-scheduling-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="03-scheduling-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="03-scheduling-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="03-scheduling-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     03 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">调度交接：topo 到来，缩容何时真的让出？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">当前 ShrinkWorkflow 采用停稳返回；priority 与 YieldTo 共同避免三任务等待环。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><g class="component" data-key="lane180" tabindex="0" role="button" aria-label="调用方"><rect class="card" x="55" y="177" width="250" height="82" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="55" y="192" width="4" height="52" rx="2" fill="#172b45"/><text x="75" y="209" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">调用方</text></g><path d="M180 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane490" tabindex="0" role="button" aria-label="TaskCenter"><rect class="card" x="365" y="177" width="250" height="82" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="365" y="192" width="4" height="52" rx="2" fill="#2459aa"/><text x="385" y="209" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">TaskCenter</text></g><path d="M490 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane800" tabindex="0" role="button" aria-label="topo Workflow"><rect class="card" x="675" y="177" width="250" height="82" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="675" y="192" width="4" height="52" rx="2" fill="#2459aa"/><text x="695" y="209" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">topo Workflow</text></g><path d="M800 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane1110" tabindex="0" role="button" aria-label="缩容 Workflow"><rect class="card" x="985" y="177" width="250" height="82" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="985" y="192" width="4" height="52" rx="2" fill="#7055a2"/><text x="1005" y="209" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">缩容 Workflow</text></g><path d="M1110 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><g class="component" data-key="lane1420" tabindex="0" role="button" aria-label="迁移服务"><rect class="card" x="1295" y="177" width="250" height="82" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1295" y="192" width="4" height="52" rx="2" fill="#237562"/><text x="1315" y="209" font-size="24" fill="#237562" font-weight="650" text-anchor="start">迁移服务</text></g><path d="M1420 264V865" stroke="#cbd6e4" stroke-dasharray="4 7"/><path d="M180 300 L490 300" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="198" y="285" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">1 提交 topo；等待准入确认</text><path d="M490 370 L1110 370" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="355" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">2 Policy → YieldTo：加入 policy 暂停原因</text><path d="M1110 440 L1420 440" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-purple)"/><text x="1128" y="425" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">3 suspend：等待实际停稳</text><path d="M1420 510 L1110 510" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-green)"/><text x="1128" y="495" font-size="18" fill="#237562" font-weight="400" text-anchor="start">4 completion → Suspended(checkpoint)</text><path d="M1110 580 L490 580" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-purple)"/><text x="508" y="565" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">5 保存 checkpoint → wait_until_runnable → ACK</text><path d="M490 650 L800 650" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="635" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">6 发放 StartPermit</text><path d="M800 720 L490 720" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="705" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">7 topo 实际完成 / reap</text><path d="M490 790 L1110 790" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#03-scheduling-blue)"/><text x="508" y="775" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">8 移除该 topo 的暂停原因</text><text x="70" y="903" font-size="20" fill="#99611c" font-weight="400" text-anchor="start">topo 尚未确认写入：不能抢占旧任务。暂停请求送达：不能当成缩容已停稳。</text><text x="70" y="941" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">priority：topo &gt; 其他 &gt; shrink；同级 FIFO。ACK 后 topo 可越过等待中的卷任务，运行占用仍须停稳。</text></svg>