<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="01-layers-title"><title id="01-layers-title">逻辑分层：谁决定业务，谁负责推进？</title><defs><marker id="01-layers-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="01-layers-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="01-layers-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="01-layers-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="01-layers-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     01 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">逻辑分层：谁决定业务，谁负责推进？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">先认清职责。层是代码职责边界，不代表进程、线程或独立服务部署。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="165" width="1504" height="143" rx="18" fill="#f0f3f7" stroke="#172b45" stroke-opacity=".3"/><text x="70" y="200" font-size="21" fill="#172b45" font-weight="650" text-anchor="start"></text><text x="70" y="201" font-size="25" fill="#172b45" font-weight="650" text-anchor="start">01</text><text x="70" y="237" font-size="21" fill="#172b45" font-weight="650" text-anchor="start">应用入口</text><text x="70" y="266" font-size="21" fill="#172b45" font-weight="650" text-anchor="start">装配</text><g class="component" data-key="root" tabindex="0" role="button" aria-label="Pool / 组合根"><rect class="card" x="265" y="178" width="402" height="118" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="265" y="193" width="4" height="88" rx="2" fill="#172b45"/><text x="285" y="210" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">Pool / 组合根</text><text x="285" y="240" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">装配 TaskCenter、客户端、依赖</text><text x="285" y="268" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">新主轮次由外部选主系统提供</text></g><g class="component" data-key="entry" tabindex="0" role="button" aria-label="PoolHandle / 业务调用方"><rect class="card" x="689" y="178" width="402" height="118" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="689" y="193" width="4" height="88" rx="2" fill="#172b45"/><text x="709" y="210" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">PoolHandle / 业务调用方</text><text x="709" y="240" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">提交 Workflow；按 TaskId 管理</text><text x="709" y="268" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">一个主的各池共享 TaskIds</text></g><g class="component" data-key="defs" tabindex="0" role="button" aria-label="Workflow 类型定义"><rect class="card" x="1113" y="178" width="402" height="118" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="1113" y="193" width="4" height="88" rx="2" fill="#172b45"/><text x="1133" y="210" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">Workflow 类型定义</text><text x="1133" y="240" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">声明 input、details、persistence</text><text x="1133" y="268" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">需要恢复的类型绑定 dependencies</text></g><rect x="48" y="322" width="1504" height="143" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="357" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start"></text><text x="70" y="358" font-size="25" fill="#2459aa" font-weight="650" text-anchor="start">02</text><text x="70" y="394" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">应用编排</text><text x="70" y="423" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">决策</text><g class="component" data-key="wf" tabindex="0" role="button" aria-label="业务 Workflow"><rect class="card" x="265" y="335" width="402" height="118" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="265" y="350" width="4" height="88" rx="2" fill="#2459aa"/><text x="285" y="367" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">业务 Workflow</text><text x="285" y="397" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">组织步骤与 checkpoint</text><text x="285" y="425" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">RunCondition 定义继续条件</text></g><g class="component" data-key="policy" tabindex="0" role="button" aria-label="SchedulingPolicy"><rect class="card" x="689" y="335" width="402" height="118" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="689" y="350" width="4" height="88" rx="2" fill="#2459aa"/><text x="709" y="367" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">SchedulingPolicy</text><text x="709" y="397" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">准入决策 + 有方向的运行关系</text><text x="709" y="425" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">优先级 + 让位关系；可替换策略</text></g><g class="component" data-key="center" tabindex="0" role="button" aria-label="TaskCenter / State"><rect class="card" x="1113" y="335" width="402" height="118" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="1113" y="350" width="4" height="88" rx="2" fill="#2459aa"/><text x="1133" y="367" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">TaskCenter / State</text><text x="1133" y="397" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">队列、占用、隔离、启动许可</text><text x="1133" y="425" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">计算暂停原因；等待真实 ACK</text></g><rect x="48" y="479" width="1504" height="143" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="70" y="514" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start"></text><text x="70" y="515" font-size="25" fill="#7055a2" font-weight="650" text-anchor="start">03</text><text x="70" y="551" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">通用执行机制</text><g class="component" data-key="driver" tabindex="0" role="button" aria-label="WorkflowDriver"><rect class="card" x="265" y="492" width="402" height="118" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="265" y="507" width="4" height="88" rx="2" fill="#7055a2"/><text x="285" y="524" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowDriver</text><text x="285" y="554" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">由 TaskCenter 轮询 Future 集合</text><text x="285" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不是额外的 Tokio task</text></g><g class="component" data-key="context" tabindex="0" role="button" aria-label="WorkflowContext"><rect class="card" x="689" y="492" width="402" height="118" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="689" y="507" width="4" height="88" rx="2" fill="#7055a2"/><text x="709" y="524" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowContext</text><text x="709" y="554" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Activity / wait_until_runnable / 控制</text><text x="709" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">资源申请、停稳跟踪、续跑记录</text></g><g class="component" data-key="index" tabindex="0" role="button" aria-label="TaskRegistry / ExecutionView"><rect class="card" x="1113" y="492" width="402" height="118" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="1113" y="507" width="4" height="88" rx="2" fill="#7055a2"/><text x="1133" y="524" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">TaskRegistry / ExecutionView</text><text x="1133" y="554" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一个 Task 的观察与控制入口</text><text x="1133" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Snapshot / Observer / RunControl</text></g><rect x="48" y="636" width="1504" height="143" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="70" y="671" font-size="21" fill="#237562" font-weight="650" text-anchor="start"></text><text x="70" y="672" font-size="25" fill="#237562" font-weight="650" text-anchor="start">04</text><text x="70" y="708" font-size="21" fill="#237562" font-weight="650" text-anchor="start">领域能力</text><text x="70" y="737" font-size="21" fill="#237562" font-weight="650" text-anchor="start">适配</text><g class="component" data-key="host" tabindex="0" role="button" aria-label="ServiceHost / ServiceHandler"><rect class="card" x="265" y="649" width="402" height="118" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="265" y="664" width="4" height="88" rx="2" fill="#237562"/><text x="285" y="681" font-size="24" fill="#237562" font-weight="650" text-anchor="start">ServiceHost / ServiceHandler</text><text x="285" y="711" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">邮箱 + Activity Futures</text><text x="285" y="739" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">每个服务有独立 Tokio 宿主</text></g><g class="component" data-key="domain" tabindex="0" role="button" aria-label="Disk / Node / VD / Migration"><rect class="card" x="689" y="649" width="402" height="118" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="689" y="664" width="4" height="88" rx="2" fill="#237562"/><text x="709" y="681" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Disk / Node / VD / Migration</text><text x="709" y="711" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">命令校验、状态和实际业务动作</text><text x="709" y="739" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">迁移示例也通过普通 client 接入</text></g><g class="component" data-key="ports" tabindex="0" role="button" aria-label="Ports / Adapters"><rect class="card" x="1113" y="649" width="402" height="118" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1113" y="664" width="4" height="88" rx="2" fill="#237562"/><text x="1133" y="681" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Ports / Adapters</text><text x="1133" y="711" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">元数据、数据面等外部接口</text><text x="1133" y="739" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域停稳确认来自真实执行</text></g><rect x="48" y="793" width="1504" height="143" rx="18" fill="#fcf5e9" stroke="#99611c" stroke-opacity=".3"/><text x="70" y="828" font-size="21" fill="#99611c" font-weight="650" text-anchor="start"></text><text x="70" y="829" font-size="25" fill="#99611c" font-weight="650" text-anchor="start">05</text><text x="70" y="865" font-size="21" fill="#99611c" font-weight="650" text-anchor="start">持久化</text><text x="70" y="894" font-size="21" fill="#99611c" font-weight="650" text-anchor="start">外部效果</text><g class="component" data-key="store" tabindex="0" role="button" aria-label="TaskStore"><rect class="card" x="265" y="806" width="402" height="118" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="265" y="821" width="4" height="88" rx="2" fill="#99611c"/><text x="285" y="838" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">TaskStore</text><text x="285" y="868" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">同一个 Task 的存储表示</text><text x="285" y="896" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">epoch fencing + revision CAS</text></g><g class="component" data-key="io" tabindex="0" role="button" aria-label="数据面 / 元数据后端"><rect class="card" x="689" y="806" width="402" height="118" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="689" y="821" width="4" height="88" rx="2" fill="#99611c"/><text x="709" y="838" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">数据面 / 元数据后端</text><text x="709" y="868" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">执行真实 IO 与领域状态提交</text><text x="709" y="896" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">TaskStore 不能替代数据面 fencing</text></g><g class="component" data-key="scope" tabindex="0" role="button" aria-label="当前实现范围"><rect class="card" x="1113" y="806" width="402" height="118" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="1113" y="821" width="4" height="88" rx="2" fill="#99611c"/><text x="1133" y="838" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">当前实现范围</text><text x="1133" y="868" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域侧仍为模拟；无确定性重放</text><text x="1133" y="896" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">完整跨主接入需领域恢复与对账</text></g></svg>