<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="05-recovery-title"><title id="05-recovery-title">持久化与切主：重建同一个 Task，继续业务</title><defs><marker id="05-recovery-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="05-recovery-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="05-recovery-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="05-recovery-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="05-recovery-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     05 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">持久化与切主：重建同一个 Task，继续业务</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">可恢复的是显式业务 checkpoint；不是序列化 Rust Future，也不是 Temporal 确定性重放。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="175" width="710" height="670" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="210" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">正常运行   ·   Workflow 自声明 Memory / Durable</text><rect x="800" y="175" width="752" height="670" rx="18" fill="#fcf5e9" stroke="#99611c" stroke-opacity=".3"/><text x="822" y="210" font-size="21" fill="#99611c" font-weight="650" text-anchor="start">新主恢复   ·   先 fencing，再恢复，再开放准入</text><g class="component" data-key="persist" tabindex="0" role="button" aria-label="Workflow::persistence()"><rect class="card" x="78" y="230" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="245" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="262" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">Workflow::persistence()</text><text x="98" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">默认 Memory：仍有完整 Task</text><text x="98" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Durable：声明 version + input</text></g><path d="M403.0 350 L403.0 375" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="journal" tabindex="0" role="button" aria-label="Journal → TaskStore"><rect class="card" x="78" y="375" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="390" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="407" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">Journal → TaskStore</text><text x="98" y="437" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">初始保存确认后才执行 / 激活调度</text><text x="98" y="465" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">checkpoint、details、控制意图、终态</text></g><path d="M403.0 495 L403.0 520" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="cas" tabindex="0" role="button" aria-label="TaskStore 写入约束"><rect class="card" x="78" y="520" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="535" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="552" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">TaskStore 写入约束</text><text x="98" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">owner_epoch 校验旧主；revision CAS</text><text x="98" y="610" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">存储写入通过 spawn_blocking 等待</text></g><path d="M403.0 640 L403.0 665" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-blue)"/><g class="component" data-key="outcome" tabindex="0" role="button" aria-label="中断 / 完成记录"><rect class="card" x="78" y="665" width="650" height="120" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="680" width="4" height="90" rx="2" fill="#2459aa"/><text x="98" y="697" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">中断 / 完成记录</text><text x="98" y="727" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">停稳中断 Pending；用户取消 Cancelled</text><text x="98" y="755" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">不确定效果 NeedsCheck，需对账</text></g><g class="component" data-key="fence" tabindex="0" role="button" aria-label="1  外部选主 / 领域恢复"><rect class="card" x="830" y="230" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="245" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="262" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">1  外部选主 / 领域恢复</text><text x="850" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">新轮次严格递增；阻止旧主数据面写入</text><text x="850" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">恢复领域状态，再绑定当前服务客户端</text></g><path d="M1176.0 350 L1176.0 375" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="define" tabindex="0" role="button" aria-label="2  define → enable_persistence"><rect class="card" x="830" y="375" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="390" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="407" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">2  define → enable_persistence</text><text x="850" y="437" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">绑定 Workflow::restore 与 dependencies</text><text x="850" y="465" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">claim(pool, epoch)；普通准入保持关闭</text></g><path d="M1176.0 495 L1176.0 520" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="restore" tabindex="0" role="button" aria-label="3  restore 全量预检与 CAS 接管"><rect class="card" x="830" y="520" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="535" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="552" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">3  restore 全量预检与 CAS 接管</text><text x="850" y="582" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">校验类型 / input / version / objects</text><text x="850" y="610" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">未知类型或需对账记录：停止恢复</text></g><path d="M1176.0 640 L1176.0 665" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#05-recovery-amber)"/><g class="component" data-key="install" tabindex="0" role="button" aria-label="4  from_restored → guard → 执行"><rect class="card" x="830" y="665" width="692" height="120" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="830" y="680" width="4" height="90" rx="2" fill="#99611c"/><text x="850" y="697" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">4  from_restored → guard → 执行</text><text x="850" y="727" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">一次安装全部任务占用，再放行许可</text><text x="850" y="755" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">用户暂停恢复；policy 原因重新计算</text></g><text x="70" y="891" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">TaskId 不变：创建轮次 / 池 UUID / 业务 / 流水；接管后只改变 owner_epoch 和 revision。</text><text x="70" y="932" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">动作已完成但 checkpoint 未写入：由稳定操作 ID、幂等命令或领域对账处理；框架不自动重放。</text></svg>