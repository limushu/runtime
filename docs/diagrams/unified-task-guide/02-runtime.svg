<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="02-runtime-title"><title id="02-runtime-title">运行闭环：谁在 poll，谁在等待，谁唤醒谁？</title><defs><marker id="02-runtime-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="02-runtime-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="02-runtime-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="02-runtime-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="02-runtime-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     02 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">运行闭环：谁在 poll，谁在等待，谁唤醒谁？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">每池一个 TaskCenter Tokio task；每个领域服务另有自己的宿主。其余框是对象或 Future。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53b5ea6  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="170" width="990" height="690" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="205" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">执行宿主 A   ·   TaskCenter 的事件循环</text><rect x="1090" y="170" width="462" height="690" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="1112" y="205" font-size="21" fill="#237562" font-weight="650" text-anchor="start">执行宿主 B…N   ·   每个领域服务</text><g class="component" data-key="state" tabindex="0" role="button" aria-label="State.reap / pump + select"><rect class="card" x="80" y="230" width="926" height="110" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="80" y="245" width="4" height="80" rx="2" fill="#2459aa"/><text x="100" y="262" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">State.reap / pump + select</text><text x="100" y="292" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">处理提交、关闭、driver.tick() 和提交确认回执</text><text x="100" y="320" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">准入已确认后才激活调度；持有 StartPermit，按策略放行</text></g><rect x="80" y="380" width="926" height="445" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="102" y="415" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowDriver.tick()   ·   同一条执行链</text><g class="component" data-key="future" tabindex="0" role="button" aria-label="running.next()"><rect class="card" x="110" y="450" width="405" height="112" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="110" y="465" width="4" height="82" rx="2" fill="#7055a2"/><text x="130" y="482" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">running.next()</text><text x="130" y="512" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">FuturesUnordered&lt;Workflow Future&gt;</text><text x="130" y="540" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">轮询就绪流程；整体完成才返回 ID</text></g><g class="component" data-key="resource" tabindex="0" role="button" aria-label="Broker / 队列 / LockTable"><rect class="card" x="550" y="450" width="420" height="136" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="550" y="465" width="4" height="106" rx="2" fill="#99611c"/><text x="570" y="482" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">Broker / 队列 / LockTable</text><text x="570" y="512" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Broker 发送 Acquire / Release</text><text x="570" y="540" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">LockTable 决定等待或返回 Permit</text><text x="570" y="568" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">状态仅在 Driver 循环中修改</text></g><g class="component" data-key="context" tabindex="0" role="button" aria-label="WorkflowContext"><rect class="card" x="110" y="650" width="405" height="135" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="110" y="665" width="4" height="105" rx="2" fill="#7055a2"/><text x="130" y="682" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowContext</text><text x="130" y="712" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">wait_until_runnable → ctx.activity()</text><text x="130" y="740" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">等待 Permit / 业务结果时 Pending</text><text x="130" y="768" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Tracker 等待真实 Activity 停稳</text></g><g class="component" data-key="client" tabindex="0" role="button" aria-label="ActivityClient"><rect class="card" x="550" y="650" width="420" height="108" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="550" y="665" width="4" height="78" rx="2" fill="#7055a2"/><text x="570" y="682" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">ActivityClient</text><text x="570" y="712" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">发送 Execute + Context + Guard</text><text x="570" y="740" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">通过 oneshot 等待类型化结果</text></g><g class="component" data-key="domain" tabindex="0" role="button" aria-label="Handler → Service → Ports"><rect class="card" x="1122" y="240" width="398" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1122" y="255" width="4" height="95" rx="2" fill="#237562"/><text x="1142" y="272" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Handler → Service → Ports</text><text x="1142" y="302" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域校验、命令、外部效果</text><text x="1142" y="330" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">停稳结果决定资源释放 / 隔离</text></g><g class="component" data-key="host" tabindex="0" role="button" aria-label="ServiceHost 循环"><rect class="card" x="1122" y="440" width="398" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1122" y="455" width="4" height="95" rx="2" fill="#237562"/><text x="1142" y="472" font-size="24" fill="#237562" font-weight="650" text-anchor="start">ServiceHost 循环</text><text x="1142" y="502" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">轮询 Activity Futures</text><text x="1142" y="530" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">接收命令和 Query；处理停止</text></g><g class="component" data-key="mail" tabindex="0" role="button" aria-label="有界服务邮箱"><rect class="card" x="1122" y="650" width="398" height="108" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1122" y="665" width="4" height="78" rx="2" fill="#237562"/><text x="1142" y="682" font-size="24" fill="#237562" font-weight="650" text-anchor="start">有界服务邮箱</text><text x="1142" y="712" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">收到 Execute 后登记执行 Future</text><text x="1142" y="740" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">服务结果通过 oneshot 返回</text></g><path d="M520 340 L520 380" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-blue)"/><text x="540" y="368" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">poll tick()</text><path d="M312 562 L312 650" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><text x="330" y="611" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">poll / await</text><path d="M515 688 L550 688" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><path d="M515 715 L530 715 L530 535 L550 535" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="545" y="615" font-size="18" fill="#99611c" font-weight="400" text-anchor="start">Acquire → Permit；Pending → 唤醒 → 再次 poll</text><path d="M970 690 L1122 690" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="994" y="673" font-size="18" fill="#237562" font-weight="400" text-anchor="start">Execute</text><path d="M1320 650 L1320 565" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1336" y="610" font-size="18" fill="#237562" font-weight="400" text-anchor="start">接收</text><path d="M1320 440 L1320 365" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1336" y="405" font-size="18" fill="#237562" font-weight="400" text-anchor="start">poll</text><path d="M1520 330 L1535 330 L1535 810 L312 810 L312 785" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="6" marker-end="url(#02-runtime-green)"/><text x="1100" y="798" font-size="18" fill="#237562" font-weight="400" text-anchor="start">oneshot 结果 → 唤醒原等待链</text><text x="82" y="904" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">① 许可 / 服务回复唤醒等待链，由 Tokio 再次调度 TaskCenter；唤醒方不会直接执行 Workflow。</text><text x="82" y="940" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">② 结束先等 Tracker 停稳，再保存终态；State 随后 reap，释放逻辑占用或保留 Uncertain 隔离。</text></svg>