<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="02-runtime-title"><title id="02-runtime-title">Driver tick：两个工作分支，分别何时返回？</title><defs><marker id="02-runtime-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2459aa"/></marker><marker id="02-runtime-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#237562"/></marker><marker id="02-runtime-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#99611c"/></marker><marker id="02-runtime-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7055a2"/></marker><marker id="02-runtime-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b45"/></marker></defs><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}.component{cursor:pointer}.component:focus{outline:none}.component:focus .card{stroke-width:4}.active .card{stroke:#e08426;stroke-width:4}.dim{opacity:.25}</style><rect width="1600" height="1040" fill="#fafbfd"/><text x="48" y="42" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">RUNTIME / 架构运行导读     02 / 06</text><text x="48" y="93" font-size="36" fill="#172b45" font-weight="650" text-anchor="start">Driver tick：两个工作分支，分别何时返回？</text><text x="48" y="133" font-size="21" fill="#52657c" font-weight="400" text-anchor="start">同一个宿主内的 select，不是两个 worker，也不是每轮先资源、再工作流各执行一次。</text><path d="M48 970H1552" stroke="#d8e0eb"/><text x="48" y="1008" font-size="17" fill="#63758c" font-weight="400" text-anchor="start">实现基线 53fae88  ·  Task = 业务管理身份；Tokio task = 执行宿主  ·  箭头表示调用 / 消息 / 唤醒，见标注</text><rect x="48" y="170" width="1042" height="700" rx="18" fill="#edf3fd" stroke="#2459aa" stroke-opacity=".3"/><text x="70" y="205" font-size="21" fill="#2459aa" font-weight="650" text-anchor="start">TaskCenter   ·   一个 Tokio task</text><g class="component" data-key="state" tabindex="0" role="button" aria-label="外层循环：reap → pump → select"><rect class="card" x="78" y="225" width="982" height="110" rx="10" fill="white" stroke="#2459aa" stroke-width="1.5"/><rect x="78" y="240" width="4" height="80" rx="2" fill="#2459aa"/><text x="98" y="257" font-size="24" fill="#2459aa" font-weight="650" text-anchor="start">外层循环：reap → pump → select</text><text x="98" y="287" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">处理提交 / shutdown / 提交确认回执 / driver.tick()</text><text x="98" y="315" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">tick 返回 Some 或 None 都回到外层重新规划；外层其他分支也可就绪</text></g><rect x="78" y="352" width="982" height="490" rx="18" fill="#f3effa" stroke="#7055a2" stroke-opacity=".3"/><text x="100" y="387" font-size="21" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowDriver.tick()   ·   tokio::select! { biased; … }</text><g class="component" data-key="notify" tabindex="0" role="button" aria-label="通知支路：wake.notified() → None"><rect class="card" x="108" y="410" width="922" height="78" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="108" y="425" width="4" height="48" rx="2" fill="#172b45"/><text x="128" y="442" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">通知支路：wake.notified() → None</text><text x="128" y="472" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">控制 / ACK 变化通知外层重算；与 Permit / 服务回复的 Waker 不同</text></g><g class="component" data-key="resource" tabindex="0" role="button" aria-label="① events.recv()"><rect class="card" x="108" y="535" width="425" height="110" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="108" y="550" width="4" height="80" rx="2" fill="#99611c"/><text x="128" y="567" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">① events.recv()</text><text x="128" y="597" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">table.event(event, &amp;broker)</text><text x="128" y="625" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">消费一条事件 → publish → None</text></g><g class="component" data-key="future" tabindex="0" role="button" aria-label="② running.next()"><rect class="card" x="585" y="535" width="445" height="110" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="585" y="550" width="4" height="80" rx="2" fill="#7055a2"/><text x="605" y="567" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">② running.next()</text><text x="605" y="597" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">poll 就绪的 Workflow Futures</text><text x="605" y="625" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">整体完成 → finish(id) → Some(id)</text></g><g class="component" data-key="locks" tabindex="0" role="button" aria-label="Broker / 队列 / LockTable"><rect class="card" x="108" y="695" width="425" height="115" rx="10" fill="white" stroke="#99611c" stroke-width="1.5"/><rect x="108" y="710" width="4" height="85" rx="2" fill="#99611c"/><text x="128" y="727" font-size="24" fill="#99611c" font-weight="650" text-anchor="start">Broker / 队列 / LockTable</text><text x="128" y="757" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Acquire / Release / Withdraw</text><text x="128" y="785" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">许可、等待、释放、隔离</text></g><g class="component" data-key="context" tabindex="0" role="button" aria-label="WorkflowContext / ActivityClient"><rect class="card" x="585" y="695" width="445" height="115" rx="10" fill="white" stroke="#7055a2" stroke-width="1.5"/><rect x="585" y="710" width="4" height="85" rx="2" fill="#7055a2"/><text x="605" y="727" font-size="24" fill="#7055a2" font-weight="650" text-anchor="start">WorkflowContext / ActivityClient</text><text x="605" y="757" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">await Pending：② 尚未就绪</text><text x="605" y="785" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">许可或回复唤醒后才再次 poll</text></g><rect x="1120" y="170" width="432" height="700" rx="18" fill="#edf7f3" stroke="#237562" stroke-opacity=".3"/><text x="1142" y="205" font-size="21" fill="#237562" font-weight="650" text-anchor="start">领域服务   ·   独立 Tokio task</text><g class="component" data-key="mail" tabindex="0" role="button" aria-label="服务邮箱 / ServiceHost"><rect class="card" x="1150" y="235" width="372" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="250" width="4" height="95" rx="2" fill="#237562"/><text x="1170" y="267" font-size="24" fill="#237562" font-weight="650" text-anchor="start">服务邮箱 / ServiceHost</text><text x="1170" y="297" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Execute + Context + Guard</text><text x="1170" y="325" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">登记并轮询 Activity Futures</text></g><g class="component" data-key="domain" tabindex="0" role="button" aria-label="Handler → Service → Ports"><rect class="card" x="1150" y="450" width="372" height="125" rx="10" fill="white" stroke="#237562" stroke-width="1.5"/><rect x="1150" y="465" width="4" height="95" rx="2" fill="#237562"/><text x="1170" y="482" font-size="24" fill="#237562" font-weight="650" text-anchor="start">Handler → Service → Ports</text><text x="1170" y="512" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">领域校验、IO 与真实停稳</text><text x="1170" y="540" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Guard → Release；oneshot 回复</text></g><g class="component" data-key="pending" tabindex="0" role="button" aria-label="② poll 到 Pending 时"><rect class="card" x="1150" y="675" width="372" height="135" rx="10" fill="white" stroke="#172b45" stroke-width="1.5"/><rect x="1150" y="690" width="4" height="105" rx="2" fill="#172b45"/><text x="1170" y="707" font-size="24" fill="#172b45" font-weight="650" text-anchor="start">② poll 到 Pending 时</text><text x="1170" y="737" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">① / 通知 / 外层仍可就绪</text><text x="1170" y="765" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">没有任何分支就绪则等待</text><text x="1170" y="793" font-size="20" fill="#263b55" font-weight="400" text-anchor="start">Activity 完成 ≠ Workflow 完成</text></g><path d="M570 335 L570 352" fill="none" stroke="#2459aa" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-blue)"/><text x="588" y="345" font-size="18" fill="#2459aa" font-weight="400" text-anchor="start">poll</text><path d="M95 397 L95 514 L310 514 L310 535" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><path d="M1045 397 L1045 514 L805 514 L805 535" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><path d="M570 397 L570 410" fill="none" stroke="#172b45" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-ink)"/><text x="340" y="517" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">biased 检查顺序：通知 → ① → ②</text><path d="M320 645 L320 695" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="335" y="675" font-size="18" fill="#99611c" font-weight="400" text-anchor="start">处理事件</text><path d="M805 645 L805 695" fill="none" stroke="#7055a2" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-purple)"/><text x="820" y="675" font-size="18" fill="#7055a2" font-weight="400" text-anchor="start">poll</text><path d="M585 735 L533 735" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="535" y="719" font-size="13" fill="#99611c" font-weight="400" text-anchor="start">Acquire</text><path d="M533 780 L585 780" fill="none" stroke="#99611c" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-amber)"/><text x="535" y="803" font-size="13" fill="#99611c" font-weight="400" text-anchor="start">Permit</text><path d="M1030 735 L1105 735 L1105 300 L1150 300" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1045" y="670" font-size="18" fill="#237562" font-weight="400" text-anchor="start">Execute</text><path d="M1335 360 L1335 450" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#02-runtime-green)"/><text x="1350" y="409" font-size="18" fill="#237562" font-weight="400" text-anchor="start">独立执行</text><path d="M1150 530 L1100 530 L1100 825 L805 825 L805 810" fill="none" stroke="#237562" stroke-width="2.2" stroke-dasharray="6" marker-end="url(#02-runtime-green)"/><text x="1128" y="615" font-size="18" fill="#237562" font-weight="400" text-anchor="start">回复 / Release → 唤醒等待链</text><text x="70" y="905" font-size="20" fill="#172b45" font-weight="400" text-anchor="start">① 返回 None；② 仅 Workflow 整体完成返回 Some(TaskId)。两者返回后 publish，外层下一轮 reap / pump。</text><text x="70" y="942" font-size="20" fill="#7055a2" font-weight="400" text-anchor="start">通知支路也返回 None：暂停 ACK 后，即使 Workflow 仍 Pending，TaskCenter 也能重算并放行 topo。</text></svg>