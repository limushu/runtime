[workspace]
members = ["crates/workflow-foundation", "crates/storage-pool"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
workflow-foundation = { path = "crates/workflow-foundation" }
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
