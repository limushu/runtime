<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Pool control plane workspace and module boundaries</title>
  <desc id="desc">The workspace contains two crates. Pool control plane depends on the business agnostic control runtime. Pool domains are Rust modules inside one crate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .workspace{fill:#f8fafc;stroke:#64748b;stroke-width:2}
      .crate{fill:#fff;stroke:#0f172a;stroke-width:2}
      .runtime{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
      .pool{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}
      .module{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.4}
      .future{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 4}
      .edge{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:6 5}
      .title{font:600 20px 'Microsoft YaHei',sans-serif;fill:#0f172a}
      .heading{font:600 16px 'Microsoft YaHei',sans-serif;fill:#0f172a}
      .text{font:14px 'Microsoft YaHei',sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:12px 'Microsoft YaHei',sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>

  <rect class="workspace" x="20" y="20" width="1160" height="650" rx="16"/>
  <text class="title" x="45" y="54">Cargo Workspace：只有两个核心 crate</text>

  <rect class="crate" x="55" y="85" width="420" height="540" rx="14"/>
  <text class="heading" x="80" y="118">control-runtime crate</text>
  <text class="small" x="265" y="142">业务无关，可独立复用</text>

  <rect class="runtime" x="90" y="165" width="150" height="48" rx="7"/>
  <text class="text" x="165" y="194">protocol</text>
  <rect class="runtime" x="285" y="165" width="150" height="48" rx="7"/>
  <text class="text" x="360" y="194">context</text>
  <rect class="runtime" x="90" y="235" width="150" height="48" rx="7"/>
  <text class="text" x="165" y="264">router</text>
  <rect class="runtime" x="285" y="235" width="150" height="48" rx="7"/>
  <text class="text" x="360" y="264">observation</text>

  <rect class="runtime" x="90" y="315" width="345" height="245" rx="10"/>
  <text class="heading" x="110" y="346">service module</text>
  <rect class="module" x="120" y="370" width="285" height="45" rx="6"/>
  <text class="text" x="262" y="398">contract</text>
  <rect class="module" x="120" y="435" width="285" height="45" rx="6"/>
  <text class="text" x="262" y="463">container · root task · poll</text>
  <rect class="module" x="120" y="500" width="285" height="45" rx="6"/>
  <text class="text" x="262" y="528">object_actor</text>
  <text class="small" x="265" y="595">禁止出现 Disk / BG / Node / Pool 业务知识</text>

  <rect class="crate" x="585" y="85" width="560" height="540" rx="14"/>
  <text class="heading" x="610" y="118">pool-control-plane crate</text>
  <text class="small" x="865" y="142">整个 Pool 业务共同发布</text>

  <rect class="pool" x="625" y="165" width="210" height="48" rx="7"/>
  <text class="text" x="730" y="194">kernel module</text>
  <rect class="pool" x="895" y="165" width="210" height="48" rx="7"/>
  <text class="text" x="1000" y="194">pool_runtime module</text>

  <rect class="pool" x="625" y="250" width="480" height="310" rx="10"/>
  <text class="heading" x="650" y="282">domains module</text>
  <rect class="module" x="660" y="310" width="185" height="55" rx="7"/>
  <text class="text" x="752" y="343">member_disk</text>
  <rect class="module" x="885" y="310" width="185" height="55" rx="7"/>
  <text class="text" x="977" y="343">virtual_disk</text>
  <rect class="module" x="660" y="395" width="185" height="55" rx="7"/>
  <text class="text" x="752" y="428">pool_node</text>
  <rect class="future" x="885" y="395" width="185" height="55" rx="7"/>
  <text class="text" x="977" y="428">tier · 后续</text>
  <rect class="future" x="772" y="480" width="185" height="55" rx="7"/>
  <text class="text" x="864" y="513">pool_core · 后续</text>
  <text class="small" x="865" y="595">Domain 是 mod；私有元数据只能由本 module 修改</text>

  <path class="edge" d="M585 135 C545 135 515 135 475 135"/>
  <text class="small" x="530" y="122">唯一 Cargo 依赖</text>
  <path class="edge" d="M1000 213 C1000 230 970 238 940 250"/>
  <path class="edge dashed" d="M845 337 L885 337"/>
  <path class="edge dashed" d="M752 365 L752 395"/>
  <text class="small" x="865" y="380">Router 调用</text>
</svg>
